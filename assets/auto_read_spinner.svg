<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Auto-read active">
  <defs>
    <!-- Neon-blue radial fill so the ring glows from the inside out. -->
    <linearGradient id="neon-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7ee0ff"/>
      <stop offset="50%"  stop-color="#3fa5ff"/>
      <stop offset="100%" stop-color="#1466ff"/>
    </linearGradient>
    <!-- Drop-shadow / outer glow. stdDeviation widens the glow halo. -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blurOuter"/>
      <feMerge>
        <feMergeNode in="blurOuter"/>
        <feMergeNode in="blurOuter"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft drop shadow under the ring. -->
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#1466ff" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#a8e3ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3fa5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Spinning ring. stroke-dasharray creates the gap; rotate animates it. -->
  <g filter="url(#drop)">
    <circle cx="32" cy="32" r="22"
            fill="none"
            stroke="url(#neon-ring)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="100 38"
            filter="url(#neon-glow)">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 32 32" to="360 32 32"
                        dur="1.4s"
                        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Four orbiting sparkles, evenly phased around the ring. Each is a
       white-to-blue gradient blob that fades in and out as it travels. -->
  <g>
    <g>
      <circle r="2.4" cx="32" cy="6" fill="url(#spark-glow)">
        <animate attributeName="opacity"
                 values="0.2;1;0.2"
                 dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 32 32" to="360 32 32"
                        dur="1.4s"
                        repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="1.6" cx="32" cy="6" fill="url(#spark-glow)">
        <animate attributeName="opacity"
                 values="0.6;0.1;0.6"
                 dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="90 32 32" to="450 32 32"
                        dur="1.4s"
                        repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="1.2" cx="32" cy="6" fill="url(#spark-glow)">
        <animate attributeName="opacity"
                 values="0.4;0.9;0.4"
                 dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="180 32 32" to="540 32 32"
                        dur="1.4s"
                        repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="1.8" cx="32" cy="6" fill="url(#spark-glow)">
        <animate attributeName="opacity"
                 values="0.9;0.3;0.9"
                 dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="270 32 32" to="630 32 32"
                        dur="1.4s"
                        repeatCount="indefinite"/>
    </g>
  </g>
</svg>
