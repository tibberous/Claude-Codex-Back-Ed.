<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" aria-label="Working">
  <defs>
    <linearGradient id="lo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ff8b00" stop-opacity="0"/>
      <stop offset="55%"  stop-color="#ff7a00" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- Faint base ring so the arc always reads -->
  <circle cx="25" cy="25" r="18.5" fill="none" stroke="rgba(255,123,0,0.22)" stroke-width="7.5"/>
  <!-- Spinning arc — thick three-quarter circle, orange gradient stroke -->
  <g style="transform-origin: 25px 25px;">
    <path d="M25 6.5
             A 18.5 18.5 0 0 1 43.5 25"
          fill="none"
          stroke="url(#lo)"
          stroke-width="7.5"
          stroke-linecap="round"/>
    <animateTransform attributeName="transform"
                      type="rotate"
                      from="0 25 25"
                      to="360 25 25"
                      dur="0.8s"
                      repeatCount="indefinite"/>
  </g>
</svg>
