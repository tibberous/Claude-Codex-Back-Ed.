# =============================================================================
# config.dist.ini — TEMPLATE shipped with the .vsix
# -----------------------------------------------------------------------------
# This file ships with the Claude Codex Black extension. On first launch CBE
# copies / reads these defaults; you (the end user) should then add your own
# API keys via:
#   1) The Setup wizard inside the panel (Settings menu), OR
#   2) Edit this file directly — every section that needs a key has a comment
#      pointing at the dashboard where you'd get it.
#
# Every secret/credential field is INTENTIONALLY EMPTY. Sections you don't
# use can stay blank — hooks that try to call into a blank section will print
# a clear error rather than running silently.
#
# Auto-update model:
#   end users PULL updates from https://trentontompkins.com/cbe (HTTPS only).
#   PUSH is disabled by default — only the maintainer with is_admin=true and
#   the matching winscp_session + remote_path can upload to the server.
# =============================================================================

# =============================================================================
# Auto-update settings.
# is_admin: ONLY clients with this set to true ever try to push files to the
#   server. Default false so a fresh checkout never accidentally uploads
#   anything from someone else's machine.
# manifest_url: HTTPS endpoint that returns the canonical file manifest.
# pull_base_url: HTTPS base for downloading individual update files.
# remote_path / winscp_session / winscp_exe are deliberately omitted here —
#   end users have no push side. Maintainer adds them locally.
# =============================================================================
[updates]
is_admin       = false
manifest_url   = https://trentontompkins.com/cbe/manifest.xml.php
pull_base_url  = https://trentontompkins.com/cbe
; remote_path  = (admin only)
; winscp_session = (admin only)
; winscp_exe   = (admin only)

# =============================================================================
# Voice / speech-to-text settings (host-side SAPI fallback).
# listen_seconds: how long the recognizer waits for a complete utterance + end
#   silence. Valid range 5-120.
# =============================================================================
[voice]
listen_seconds = 30

[api_keys]
# OpenAI/ChatGPT API key for api.openai.com.
openai_api_key =
# Google Gemini API key for generativelanguage.googleapis.com.
gemini_api_key =
# Claude / Anthropic API key.
anthropic_api_key =
# xAI/Grok API key for api.x.ai.
xai_api_key =
# DeepSeek direct API key for api.deepseek.com (OpenAI-compatible).
# Get one at https://platform.deepseek.com/api_keys
deepseek_api_key =
# Default direct model id per provider (override at call time if needed).
grok_model_choice = grok-4.3
gpt_model_choice = gpt-5.4
gem_model_choice = gemini-2.5-pro
claude_model_choice = claude-sonnet-4-6

# -----------------------------------------------------------------------------
# Microsoft Azure OpenAI / Azure AI Services
# -----------------------------------------------------------------------------
# endpoint + api_key call an already-known Azure OpenAI deployment.
# subscription_id + resource_group + account_name + tenant_id + client_id +
# client_secret are used for ARM-level deployment discovery / management.
# -----------------------------------------------------------------------------
[azure]
# Example: https://YOUR-RESOURCE.openai.azure.com/
endpoint =
# Azure OpenAI inference key for calling a known deployment.
api_key =
api_key1 =
api_key2 =
# Exact deployed Azure deployment name. This is not the base model name.
deployment_name =
# Azure subscription UUID.
subscription_id =
# Resource group containing the Azure OpenAI/Azure AI Services account.
resource_group =
# Azure AI/Cognitive Services account name.
account_name =
# Optional temporary Azure management bearer token. Usually leave blank.
access_token =
# Friendly app registration name. Not used as the OAuth client_id.
app_name =
# Directory (tenant) ID from Microsoft Entra ID.
tenant_id =
# Application (client) ID from the App Registration Overview page.
client_id =
# Client secret VALUE from Certificates & secrets. Rotate if exposed.
client_secret =
# Optional secret ID metadata. OAuth needs the VALUE above, not this ID.
client_secret_id =
cognitive_services_endpoint =
stt_endpoint =
tts_endpoint =

# =============================================================================
# HOOK CREDENTIALS — every section below is consumed by a file under /hooks.
# Each hook reads via hooks/_config.py (cfg helper) and falls back to the env
# var listed in the comment if the config key is blank. Leave blank for
# integrations you don't use.
# =============================================================================

# -----------------------------------------------------------------------------
# Airtable — REST API for bases / tables / records.
# Used by: hooks/airtable_hook.py
# Create a token: https://airtable.com/create/tokens
# -----------------------------------------------------------------------------
[airtable]
# Bearer token. Scopes depend on hook usage: data.records:read, .write,
# schema.bases:read. Env fallback: AIRTABLE_API_TOKEN.
api_token =
api_base = https://api.airtable.com/v0

# -----------------------------------------------------------------------------
# Browserless — remote headless Chrome as a service.
# Used by: hooks/browserless_hook.py
# Sign-up: https://www.browserless.io/
# -----------------------------------------------------------------------------
[browserless]
# Account token. Env fallback: BROWSERLESS_TOKEN.
token =
api_base = https://production-sfo.browserless.io

# -----------------------------------------------------------------------------
# Cloudflare — DNS, Workers, R2, Pages, Zone management.
# Used by: hooks/cloudflare_hook.py
# Tokens: https://dash.cloudflare.com/profile/api-tokens
# -----------------------------------------------------------------------------
[cloudflare]
# API token (NOT global key). Permissions: Zone:DNS:Edit, Zone:Zone:Read,
# Account:Workers:Edit. Env fallback: CLOUDFLARE_API_TOKEN.
api_token =
api_base = https://api.cloudflare.com/client/v4

# -----------------------------------------------------------------------------
# ElevenLabs — TTS voice synthesis.
# Used by: hooks/elevenlabs_hook.py
# Keys: https://elevenlabs.io/app/settings/api-keys
# -----------------------------------------------------------------------------
[elevenlabs]
# Account API key. Env fallback: ELEVENLABS_API_KEY.
api_key =
# Voice id used when none passed. "21m00Tcm4TlvDq8ikWAM" is Rachel.
default_voice_id = 21m00Tcm4TlvDq8ikWAM
# eleven_turbo_v2 is fastest, eleven_multilingual_v2 supports more languages.
default_model = eleven_turbo_v2
api_base = https://api.elevenlabs.io/v1

# -----------------------------------------------------------------------------
# GitHub — REST API v3.
# Used by: hooks/github_hook.py
# Generate a token at: https://github.com/settings/tokens/new
# Classic-token scopes for full coverage:
#   repo, workflow, write:packages, delete_repo, admin:org, gist,
#   notifications, user, read:project, read:packages, security_events
# -----------------------------------------------------------------------------
[github]
# Personal Access Token (classic OR fine-grained). Env fallback: GITHUB_TOKEN.
# Classic tokens start with `ghp_`; fine-grained start with `github_pat_`.
token =
api_base = https://api.github.com
# Default owner used when a hook command omits one (e.g. `create-repo NAME`).
default_owner =

# -----------------------------------------------------------------------------
# Google Workspace / Sheets / Gmail — service account + admin email.
# Used by: hooks/google_workspace_hook.py, google_sheets_hook.py,
#          gmail_api_hook.py
# Service account: https://console.cloud.google.com/iam-admin/serviceaccounts
# -----------------------------------------------------------------------------
[google]
# Filesystem path to the service-account JSON key file. Keep the JSON OUT
# of the repo. Env fallback: GOOGLE_SERVICE_ACCOUNT_JSON.
service_account_json =
# Admin user the service account impersonates (domain-wide delegation).
# Env fallback: GOOGLE_ADMIN_EMAIL.
admin_email =

# -----------------------------------------------------------------------------
# NameSilo — domain registrar API.
# Used by: hooks/namesilo_hook.py
# Manage keys: https://www.namesilo.com/account/api-manager
# -----------------------------------------------------------------------------
[namesilo]
# API key. Env fallback: NAMESILO_API_KEY.
api_key =
base_url = https://www.namesilo.com/api

# -----------------------------------------------------------------------------
# Runway ML — text-to-image, image-to-video generation.
# Used by: hooks/runway_hook.py
# Keys: https://dev.runwayml.com/
# -----------------------------------------------------------------------------
[runway]
# API key (starts with `key_`). Env fallback: RUNWAY_API_KEY.
api_key =
api_base = https://api.dev.runwayml.com
# Pinned API version — must match what the hook implements.
default_version = 2024-11-06

# -----------------------------------------------------------------------------
# SendGrid — transactional email.
# Used by: hooks/sendgrid_hook.py
# Keys: https://app.sendgrid.com/settings/api_keys
# -----------------------------------------------------------------------------
[sendgrid]
# API key (Mail Send scope is enough for most flows). Env fallback: SENDGRID_API_KEY.
api_key =
# Verified sender address. Env fallback: SENDGRID_FROM_EMAIL.
from_email =
api_base = https://api.sendgrid.com/v3

# -----------------------------------------------------------------------------
# SerpAPI — search-engine results API (Google, Bing, etc.).
# Used by: hooks/serp_hook.py
# Keys: https://serpapi.com/manage-api-key
# -----------------------------------------------------------------------------
[serpapi]
# API key. Env fallback: SERPAPI_KEY.
api_key =
api_base = https://serpapi.com

# -----------------------------------------------------------------------------
# Stability AI — Stable Diffusion text-to-image, upscale, etc.
# Used by: hooks/stability_hook.py
# Keys: https://platform.stability.ai/account/keys
# -----------------------------------------------------------------------------
[stability]
# API key. Env fallback: STABILITY_API_KEY.
api_key =
api_base = https://api.stability.ai/v1
# Default engine id — see https://platform.stability.ai/docs/api-reference#tag/engines
default_engine = stable-diffusion-xl-1024-v1-0

# -----------------------------------------------------------------------------
# Twilio — SMS, voice, WhatsApp.
# Used by: hooks/twilio_hook.py
# Console: https://console.twilio.com/
# -----------------------------------------------------------------------------
[twilio]
# Account SID (starts with `AC`). Env fallback: TWILIO_ACCOUNT_SID.
account_sid =
# Auth token. Env fallback: TWILIO_AUTH_TOKEN.
auth_token =
# Default outbound number in E.164 (+12125551234). Env fallback: TWILIO_FROM_NUMBER.
from_number =

# -----------------------------------------------------------------------------
# Email (IMAP + SMTP) — generic mailbox for hooks that send/check mail.
# Used by: hooks/email_hook.py, email_check_hook.py, email_password_hook.py
# Gmail app password: https://myaccount.google.com/apppasswords
# -----------------------------------------------------------------------------
[email]
smtp_server = smtp.gmail.com
smtp_port = 587
imap_server = imap.gmail.com
imap_port = 993
# Mailbox login. Env fallback: EMAIL_ACCOUNT.
account =
# App password (16-char Gmail format) or SMTP password. Env fallback: EMAIL_PASSWORD.
password =
# Default "To:" used by email_hook.py when no recipient is passed. Env fallback: EMAIL_DEFAULT_TO.
default_to =

# -----------------------------------------------------------------------------
# X / Twitter — OAuth1 + OAuth2 credentials.
# Used by: hooks/x_hook.py
# Dev portal: https://developer.x.com/en/portal/dashboard
# -----------------------------------------------------------------------------
[x]
# OAuth1 consumer key + secret (formerly "API Key" / "API Key Secret").
consumer_key =
consumer_secret =
# App-only bearer token (server-to-server reads).
bearer_token =
# OAuth1 user access token + secret (read/write on behalf of one user).
oauth1_access_token =
oauth1_access_token_secret =
# OAuth2 confidential-client credentials.
client_id =
client_secret =
api_base = https://api.x.com/2
token_url = https://api.x.com/2/oauth2/token

# -----------------------------------------------------------------------------
# Stable Diffusion (local Forge / Automatic1111).
# Used by: hooks/sd_hook.py
# -----------------------------------------------------------------------------
[sd]
# Forge / A1111 endpoint. Default port is 7860.
forge_url = http://127.0.0.1:7860
default_model = dreamshaper_8.safetensors

# -----------------------------------------------------------------------------
# Indeed — job search scraping target.
# Used by: hooks/indeed_hook.py
# -----------------------------------------------------------------------------
[indeed]
base_url = https://www.indeed.com


[extensions]
pinned = minesweeper,calculator,emoji-picker

# -----------------------------------------------------------------------------
# ChatGPT web login credentials — used by --library when GPT pilots the
# browser through the login flow. Filled in only if you actually use the
# browser-bridge library sync feature.
# -----------------------------------------------------------------------------
[chatgpt]
email    =
password =

# Bing Video Creator + any Microsoft-account-gated bridge. The Microsoft
# (hotmail/outlook/live) account is SEPARATE from the Google account used
# for ChatGPT/Grok/Claude/Gemini.
[bing]
email    =
password =

[bing-video]
email    =
password =

# -----------------------------------------------------------------------------
# SuperGrok bridge transport. host/port are read at startup by start.py's
# bridge client (and bridge/supergrok-bridge.js). If the configured port is
# already in use the client falls back to an OS-assigned free port.
# -----------------------------------------------------------------------------
[bridge]
host = 127.0.0.1
port = 8788
# Per-target predictable ports.
chatgpt_port = 8788
grok_port    = 8789
copilot_port = 8790
gemini_port  = 8791
claude_port  = 8792

[stats]
run_count = 0
last_run =

# Generic VPS connection settings (only filled in if you operate your own server).
[vps]
host =
hostname =
user =
password =
port = 22
panel_port = 8899
winscp_session =
