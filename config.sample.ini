# =============================================================================
# config.sample.ini
# -----------------------------------------------------------------------------
# This is the SHARED template that ships with the extension. The real file
# (config.ini) is .gitignore'd and lives only on each user's machine.
#
# First-time setup:
#     cp config.sample.ini config.ini
# Then fill in the values for the integrations you actually use. Every
# section has comments pointing at the dashboard where you'd get the key.
# Sections you don't use can stay blank — hooks that try to call into a
# blank section will print a clear error rather than running silently.
# =============================================================================

[api_keys]
# OpenAI/ChatGPT API key for api.openai.com.
openai_api_key =
# Google Gemini API key for generativelanguage.googleapis.com.
gemini_api_key =
# Claude / Anthropic API key.
anthropic_api_key =
# xAI / Grok API key for api.x.ai.
xai_api_key =
# Default model choice per provider (override at call time if needed).
grok_model_choice = grok-4.3
gpt_model_choice = gpt-5.4
gem_model_choice = gemini-2.5-pro
claude_model_choice = claude-sonnet-4-6

# -----------------------------------------------------------------------------
# Microsoft Azure OpenAI / Azure AI Services
# -----------------------------------------------------------------------------
# endpoint + api_key call an already-known Azure OpenAI deployment.
# subscription_id + resource_group + account_name + tenant_id + client_id +
# client_secret are used for ARM-level deployment discovery / management.
# -----------------------------------------------------------------------------
[azure]
# Example: https://YOUR-RESOURCE.openai.azure.com/
endpoint =
# Azure OpenAI inference key.
api_key =
api_key1 =
api_key2 =
# Exact deployed Azure deployment name. NOT the base model name.
deployment_name =
# Azure subscription UUID.
subscription_id =
# Resource group containing the Azure OpenAI/Azure AI Services account.
resource_group =
# Azure AI/Cognitive Services account name.
account_name =
# Optional temporary Azure management bearer token. Usually leave blank.
access_token =
# Friendly app registration name. Not used as the OAuth client_id.
app_name =
# Directory (tenant) ID from Microsoft Entra ID.
tenant_id =
# Application (client) ID from the App Registration Overview page.
client_id =
# Client secret VALUE from Certificates & secrets. Rotate if exposed.
client_secret =
# Optional secret ID metadata. OAuth needs the VALUE above, not this ID.
client_secret_id =
cognitive_services_endpoint =
stt_endpoint =
tts_endpoint =

# =============================================================================
# HOOK CREDENTIALS — every section below is consumed by a file under /hooks.
# Each hook reads via hooks/_config.py (cfg helper) and falls back to the env
# var listed in the comment if the config key is blank.
# =============================================================================

# -----------------------------------------------------------------------------
# Airtable — REST API for bases / tables / records.
# Used by: hooks/airtable_hook.py
# Token: https://airtable.com/create/tokens
# -----------------------------------------------------------------------------
[airtable]
# Bearer token. Scopes: data.records:read, data.records:write,
# schema.bases:read. Env fallback: AIRTABLE_API_TOKEN.
api_token =
api_base = https://api.airtable.com/v0

# -----------------------------------------------------------------------------
# Browserless — remote headless Chrome.
# Used by: hooks/browserless_hook.py
# -----------------------------------------------------------------------------
[browserless]
# Account token. Env fallback: BROWSERLESS_TOKEN.
token =
api_base = https://production-sfo.browserless.io

# -----------------------------------------------------------------------------
# Cloudflare — DNS, Workers, R2, Pages, Zone management.
# Used by: hooks/cloudflare_hook.py
# Tokens: https://dash.cloudflare.com/profile/api-tokens
# -----------------------------------------------------------------------------
[cloudflare]
# API token (NOT global key). Env fallback: CLOUDFLARE_API_TOKEN.
api_token =
api_base = https://api.cloudflare.com/client/v4

# -----------------------------------------------------------------------------
# ElevenLabs — TTS voice synthesis.
# Used by: hooks/elevenlabs_hook.py
# Keys: https://elevenlabs.io/app/settings/api-keys
# -----------------------------------------------------------------------------
[elevenlabs]
# Env fallback: ELEVENLABS_API_KEY.
api_key =
# "21m00Tcm4TlvDq8ikWAM" is Rachel.
default_voice_id = 21m00Tcm4TlvDq8ikWAM
default_model = eleven_turbo_v2
api_base = https://api.elevenlabs.io/v1

# -----------------------------------------------------------------------------
# GitHub — REST API v3.
# Used by: hooks/github_hook.py
#
# What ONE PAT can do — menu of what github_hook.py can reach:
#   Repos        — list / create / delete / fork / archive / rename / transfer
#   Files        — read / create / update / delete via Contents API
#   Branches     — list / create / delete / protect / get default
#   Commits      — list / get / compare / create
#   Tags+Release — list / create / delete / upload assets
#   Issues       — list / get / create / update / close / lock / label / assign
#   Pull reqs    — list / create / update / merge / close / review / comment
#   Workflows    — list runs / dispatch / cancel / re-run / download logs
#   Secrets/vars — list / create / update / delete (Actions + Codespaces)
#   Webhooks     — list / create / update / delete
#   Packages     — list versions / delete / restore
#   Gists        — list / create / update / delete / fork / star
#   Notifications- list / mark read / unread
#   Code-scan    — list / get / dismiss alerts (Dependabot, secret-scanning)
#   Codespaces   — list / create / delete / start / stop
#   Search       — code / repos / issues / users / commits
#   User         — profile, follow / unfollow, followers / following
#   Orgs/teams   — list / add member / remove member
#
# Generate a token at: https://github.com/settings/tokens/new
# Classic-token scopes for FULL coverage:
#   repo, workflow, write:packages, delete_repo, admin:org, gist,
#   notifications, user, read:project, read:packages, security_events
# Fine-grained alternative: pick repo/org permissions individually —
# Contents (rw), Issues, Pull requests, Workflows, Actions, Administration,
# Metadata cover most flows.
# -----------------------------------------------------------------------------
[github]
# Env fallback: GITHUB_TOKEN. Classic tokens start with `ghp_`; fine-grained
# tokens start with `github_pat_`.
token =
api_base = https://api.github.com
# Default owner used when a hook command omits one (e.g. `create-repo NAME`).
default_owner =

# -----------------------------------------------------------------------------
# Google Workspace / Sheets / Gmail — service account + admin email.
# Used by: hooks/google_workspace_hook.py, google_sheets_hook.py,
#          gmail_api_hook.py
# Service account: https://console.cloud.google.com/iam-admin/serviceaccounts
# -----------------------------------------------------------------------------
[google]
# Filesystem path to the service-account JSON key file. Keep the JSON OUT
# of the repo. Env fallback: GOOGLE_SERVICE_ACCOUNT_JSON.
service_account_json =
# Admin user the service account impersonates (domain-wide delegation).
# Env fallback: GOOGLE_ADMIN_EMAIL.
admin_email =

# -----------------------------------------------------------------------------
# NameSilo — domain registrar API.
# Used by: hooks/namesilo_hook.py
# Keys: https://www.namesilo.com/account/api-manager
# -----------------------------------------------------------------------------
[namesilo]
# Env fallback: NAMESILO_API_KEY.
api_key =
base_url = https://www.namesilo.com/api

# -----------------------------------------------------------------------------
# Runway ML — text-to-image, image-to-video.
# Used by: hooks/runway_hook.py
# Keys: https://dev.runwayml.com/
# -----------------------------------------------------------------------------
[runway]
# Starts with `key_`. Env fallback: RUNWAY_API_KEY.
api_key =
api_base = https://api.dev.runwayml.com
default_version = 2024-11-06

# -----------------------------------------------------------------------------
# SendGrid — transactional email.
# Used by: hooks/sendgrid_hook.py
# Keys: https://app.sendgrid.com/settings/api_keys
# -----------------------------------------------------------------------------
[sendgrid]
# Mail Send scope is enough for most flows. Env fallback: SENDGRID_API_KEY.
api_key =
# Verified sender address. Env fallback: SENDGRID_FROM_EMAIL.
from_email =
api_base = https://api.sendgrid.com/v3

# -----------------------------------------------------------------------------
# SerpAPI — search-engine results API.
# Used by: hooks/serp_hook.py
# Keys: https://serpapi.com/manage-api-key
# -----------------------------------------------------------------------------
[serpapi]
# Env fallback: SERPAPI_KEY.
api_key =
api_base = https://serpapi.com

# -----------------------------------------------------------------------------
# Stability AI — Stable Diffusion text-to-image, upscale, etc.
# Used by: hooks/stability_hook.py
# Keys: https://platform.stability.ai/account/keys
# -----------------------------------------------------------------------------
[stability]
# Env fallback: STABILITY_API_KEY.
api_key =
api_base = https://api.stability.ai/v1
default_engine = stable-diffusion-xl-1024-v1-0

# -----------------------------------------------------------------------------
# Twilio — SMS, voice, WhatsApp.
# Used by: hooks/twilio_hook.py
# Console: https://console.twilio.com/
# -----------------------------------------------------------------------------
[twilio]
# Starts with `AC`. Env fallback: TWILIO_ACCOUNT_SID.
account_sid =
# Env fallback: TWILIO_AUTH_TOKEN.
auth_token =
# E.164 format (+12125551234). Env fallback: TWILIO_FROM_NUMBER.
from_number =

# -----------------------------------------------------------------------------
# Email (IMAP + SMTP) — generic mailbox.
# Used by: hooks/email_hook.py, email_check_hook.py, email_password_hook.py
# Gmail app password: https://myaccount.google.com/apppasswords
# -----------------------------------------------------------------------------
[email]
smtp_server = smtp.gmail.com
smtp_port = 587
imap_server = imap.gmail.com
imap_port = 993
# Env fallback: EMAIL_ACCOUNT.
account =
# 16-char Gmail app password or SMTP password. Env fallback: EMAIL_PASSWORD.
password =
# Default "To:" when no recipient passed. Env fallback: EMAIL_DEFAULT_TO.
default_to =

# -----------------------------------------------------------------------------
# X / Twitter — OAuth1 + OAuth2.
# Used by: hooks/x_hook.py
# Dev portal: https://developer.x.com/en/portal/dashboard
# -----------------------------------------------------------------------------
[x]
# OAuth1 consumer (a.k.a. "API Key" / "API Key Secret").
consumer_key =
consumer_secret =
# App-only bearer token (server-to-server reads).
bearer_token =
# OAuth1 user access token + secret.
oauth1_access_token =
oauth1_access_token_secret =
# OAuth2 confidential client credentials.
client_id =
client_secret =
api_base = https://api.x.com/2
token_url = https://api.x.com/2/oauth2/token

# -----------------------------------------------------------------------------
# Stable Diffusion (local Forge / Automatic1111).
# Used by: hooks/sd_hook.py
# -----------------------------------------------------------------------------
[sd]
forge_url = http://127.0.0.1:7860
default_model = dreamshaper_8.safetensors

# -----------------------------------------------------------------------------
# Indeed — job search scraping target.
# Used by: hooks/indeed_hook.py
# -----------------------------------------------------------------------------
[indeed]
base_url = https://www.indeed.com
