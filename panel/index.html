<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src vscode-resource: https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Codex Black</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      background: #111111;
      color: #f5f5f5;
      font-family: var(--vscode-font-family, Arial, sans-serif);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .shell {
      width: min(900px, 100%);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 127, 39, 0.18), rgba(0, 0, 0, 0.28));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      padding: 32px;
      text-align: center;
    }
    .label {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.55));
    }
    .caption {
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="shell">
    <img class="label" src="{{LABEL_ALPHA_URI}}" alt="Claude Codex Black" />
    <div class="caption">Standalone Panel</div>
  </main>
</body>
</html>
