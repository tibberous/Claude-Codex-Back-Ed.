<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Claude Codex Black</title>
<link rel="stylesheet" href="{{PRISM_CSS_URI}}" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0a0a0a; color: #e8e8e8;
    font-family: 'Consolas', 'Courier New', monospace; }
  #app { display: flex; flex-direction: column; height: 100vh; }

  #thread { flex: 1; overflow-y: auto; padding: 18px; display: flex;
    flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 6px; font-size: 13px;
    line-height: 1.55; max-width: 92%; word-break: break-word;
    white-space: pre-wrap; }
  .msg.sent      { background: #1c1c1c; border: 1px solid #2a2a2a;
                   align-self: flex-end; color: #e8e8e8; }
  .msg.assistant { background: #15171c; border: 1px solid #232a37;
                   align-self: flex-start; color: #d9e2f3; }
  .msg.info      { background: #131313; border: 1px solid #1f1f1f;
                   align-self: flex-start; color: #777; font-size: 11px; font-style: italic; }
  .msg.error     { background: #2a1212; border: 1px solid #5a1f1f;
                   align-self: flex-start; color: #ff9b9b; }
  .msg.assistant.streaming::after { content: '▍'; opacity: .6; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 0%,50% { opacity: .6 } 51%,100% { opacity: 0 } }
  #thread::-webkit-scrollbar { width: 4px; }
  #thread::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

  #input-wrap { padding: 10px 12px; background: #0a0a0a; }
  #input-box { border: 2px solid #ff7a1a; border-radius: 10px;
    background: #111; padding: 10px 12px;
    box-shadow: 0 0 0 1px rgba(255,122,26,0.15) inset; }
  #input-box.busy { border-color: #d69e2e;
    box-shadow: 0 0 0 1px rgba(214,158,46,0.15) inset; }
  #textInput { width: 100%; border: none; outline: none; background: transparent;
    color: #e8e8e8; font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px; line-height: 1.5; resize: none; min-height: 24px;
    max-height: 140px; }
  #textInput::placeholder { color: #555; }
  #textInput:disabled { color: #555; cursor: not-allowed; }

  #toolbar { display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: linear-gradient(90deg, #b83c00 0%, #e8621a 55%, #ff7a1a 100%);
    border-top: 1px solid #401300; }
  .tb-btn { all: unset; cursor: pointer; width: 32px; height: 32px;
    border-radius: 6px; display: inline-flex; align-items: center;
    justify-content: center; color: #fff; font-size: 16px;
    transition: background-color .12s; }
  .tb-btn:hover { background-color: rgba(0,0,0,0.18); }
  #label-pill { flex: 0 0 auto; height: 32px;
    background-image: url('{{LABEL_ALPHA_URI}}');
    background-size: contain; background-repeat: no-repeat;
    background-position: center; cursor: pointer;
    margin: 0 6px; transition: filter .12s; }
  #label-pill:hover { filter: brightness(1.12); }
  #spacer { flex: 1; }
  #sendBtn { all: unset; cursor: pointer; width: 36px; height: 36px;
    border-radius: 50%; background: #1a1a1a; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; transition: transform .1s; }
  #sendBtn:hover { transform: scale(1.06); }
  #sendBtn[disabled] { background: #444; cursor: not-allowed; transform: none; }

  /* ── Code block rendering (Prism wrappers, orange CBE theme) ───────── */
  .msg.assistant .cv-code-wrap { border-radius: 6px; overflow: hidden;
    margin: .6em 0; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .msg.assistant .cv-code-bar { display: flex; align-items: center;
    justify-content: space-between; padding: 5px 12px;
    background: linear-gradient(90deg, #b83c00 0%, #d44e0a 50%, #e8621a 100%);
    border-bottom: 1px solid rgba(0,0,0,.25); }
  .msg.assistant .cv-code-lang { font-family: 'Consolas','Fira Code',monospace;
    font-size: 11px; color: #fff; letter-spacing: .06em;
    text-transform: uppercase; font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .msg.assistant .cv-copy-btn { display: inline-flex; align-items: center;
    gap: 4px; background: rgba(0,0,0,.20);
    border: 1px solid rgba(255,255,255,.30); border-radius: 4px;
    color: #ffe0d0; font-size: 11px; font-weight: 600; cursor: pointer;
    padding: 2px 8px; letter-spacing: .04em;
    transition: background .15s, color .15s; }
  .msg.assistant .cv-copy-btn:hover { background: rgba(0,0,0,.35); color: #fff; }
  .msg.assistant .cv-copy-btn.copied { color: #6ee7b7; border-color: #6ee7b7; }
  /* Reset Prism's brown bg/borders to dark VS Code style. */
  .msg.assistant pre[class*="language-"],
  .msg.assistant code[class*="language-"] {
    background: #1e1e1e !important; text-shadow: none !important;
    color: #d4d4d4 !important;
    font-family: 'Consolas','Fira Code',monospace !important; font-size: 12px; }
  .msg.assistant pre[class*="language-"] {
    margin: 0 !important; padding: 12px !important;
    border-radius: 0 0 6px 6px !important; overflow: auto !important;
    border: none !important; box-shadow: none !important;
    white-space: pre; }
  /* VS Code dark+ token colours */
  .msg.assistant .token.comment    { color: #6a9955 !important; }
  .msg.assistant .token.keyword    { color: #569cd6 !important; }
  .msg.assistant .token.string     { color: #ce9178 !important; }
  .msg.assistant .token.number     { color: #b5cea8 !important; }
  .msg.assistant .token.function   { color: #dcdcaa !important; }
  .msg.assistant .token.class-name { color: #4ec9b0 !important; }
  .msg.assistant .token.operator,
  .msg.assistant .token.punctuation { color: #d4d4d4 !important; }
  .msg.assistant .token.builtin    { color: #4ec9b0 !important; }
  .msg.assistant .token.boolean    { color: #569cd6 !important; }
  .msg.assistant .token.property   { color: #9cdcfe !important; }
  .msg.assistant .token.tag        { color: #569cd6 !important; }
  .msg.assistant .token.attr-name  { color: #9cdcfe !important; }
  .msg.assistant .token.attr-value { color: #ce9178 !important; }
  .msg.assistant .token.selector   { color: #d7ba7d !important; }
  .msg.assistant .token.atrule     { color: #c586c0 !important; }
  .msg.assistant .token.variable   { color: #9cdcfe !important; }
  /* Inline `code` (single-backtick, non-fenced) */
  .msg.assistant code.cv-inline {
    background: #2a2a2e; color: #ce9178;
    padding: 1px 5px; border-radius: 3px;
    font-family: 'Consolas','Fira Code',monospace; font-size: 12px; }
  /* Final-rendered assistant msg should not pre-wrap (mixed block/inline) */
  .msg.assistant.rendered { white-space: normal; }
  .msg.assistant.rendered .cv-prose { white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app">
  <div id="thread">
    <div class="msg info">Claude Codex Black — standalone. Type to send. First send will prompt for your API key.</div>
  </div>

  <div id="input-wrap">
    <div id="input-box">
      <textarea id="textInput" placeholder="Queue another message…" rows="1"></textarea>
    </div>
  </div>

  <div id="toolbar">
    <button class="tb-btn" id="addBtn" title="New conversation">+</button>
    <button class="tb-btn" id="queueBtn" title="History">≡</button>
    <div id="label-pill" title="Claude Codex Black Edition"></div>
    <div id="spacer"></div>
    <button class="tb-btn" id="micBtn" title="Voice input (not wired yet)">🎙</button>
    <button class="tb-btn" id="monitorBtn" title="Trace">◉</button>
    <button id="sendBtn" title="Send">▶</button>
  </div>
</div>

<script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>
<script src="{{PRISM_JS_URI}}"></script>
<script src="{{PRISM_LANGS_URI}}"></script>
<script>
const api = (typeof acquireVsCodeApi === 'function') ? acquireVsCodeApi() : null;
const thread = document.getElementById('thread');
const ti     = document.getElementById('textInput');
const inBox  = document.getElementById('input-box');
const sendBtn= document.getElementById('sendBtn');
const addBtn = document.getElementById('addBtn');

let busy = false;
let streamingEl = null;

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  thread.appendChild(d);
  thread.scrollTop = thread.scrollHeight;
  return d;
}

/* ── Markdown fence rendering ────────────────────────────────────────── */
const LANG_MAP = {
  'powershell':'powershell','posh':'powershell','ps1':'powershell','ps':'powershell','psm1':'powershell',
  'bash':'bash','sh':'bash','shell':'bash','zsh':'bash',
  'xml':'xml','html':'markup','htm':'markup','xhtml':'markup',
  'svg':'svg',
  'css':'css','scss':'css','less':'css',
  'python':'python','py':'python',
  'js':'javascript','javascript':'javascript',
  'ts':'typescript','typescript':'typescript',
  'php':'php',
  'json':'json','yaml':'yaml','yml':'yaml'
};
const LANG_LABEL = {
  'powershell':'PowerShell','bash':'Bash','markup':'HTML','xml':'XML','svg':'SVG',
  'css':'CSS','python':'Python','javascript':'JavaScript','typescript':'TypeScript',
  'php':'PHP','json':'JSON','yaml':'YAML'
};

function makeCopyBtn(rawCode) {
  const btn = document.createElement('button');
  btn.className = 'cv-copy-btn';
  btn.type = 'button';
  btn.textContent = 'Copy';
  btn.onclick = () => {
    const done = () => {
      btn.classList.add('copied');
      btn.textContent = 'Copied!';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.textContent = 'Copy';
      }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(rawCode).then(done, () => {
        /* Fallback: textarea + execCommand */
        const ta = document.createElement('textarea');
        ta.value = rawCode;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        done();
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = rawCode;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  };
  return btn;
}

function makeCodeBlock(rawLang, rawCode) {
  /* Normalize lang. Unknown lang -> plain (no highlighting, but still wrap). */
  const key = (rawLang || '').trim().toLowerCase();
  const lang = LANG_MAP[key] || (key && /^[a-z0-9+#-]+$/i.test(key) ? key : '');
  const label = LANG_LABEL[lang] || (rawLang || 'TEXT').toUpperCase();

  const wrap = document.createElement('div');
  wrap.className = 'cv-code-wrap';

  const bar = document.createElement('div');
  bar.className = 'cv-code-bar';

  const langSpan = document.createElement('span');
  langSpan.className = 'cv-code-lang';
  langSpan.textContent = label;
  bar.appendChild(langSpan);
  bar.appendChild(makeCopyBtn(rawCode));

  const pre = document.createElement('pre');
  pre.className = 'line-numbers' + (lang ? ' language-' + lang : '');
  const codeEl = document.createElement('code');
  codeEl.className = lang ? 'language-' + lang : '';
  codeEl.textContent = rawCode;  /* textContent escapes safely */
  pre.appendChild(codeEl);

  wrap.appendChild(bar);
  wrap.appendChild(pre);

  /* Run Prism if it loaded and lang is known. */
  if (lang && window.Prism && Prism.languages && Prism.languages[lang]) {
    try { Prism.highlightElement(codeEl); }
    catch (e) { /* swallow — leave plain */ }
  }
  return wrap;
}

/* Inline `code` (single-backtick) — only on prose chunks, not inside fences. */
function renderInlineCode(textNode, container) {
  const text = textNode;
  /* Simple single-backtick pass. Skip empty matches. */
  const parts = text.split(/(`[^`\r\n]+?`)/g);
  parts.forEach(part => {
    if (!part) return;
    const m = /^`([^`\r\n]+)`$/.exec(part);
    if (m) {
      const c = document.createElement('code');
      c.className = 'cv-inline';
      c.textContent = m[1];
      container.appendChild(c);
    } else {
      const span = document.createElement('span');
      span.className = 'cv-prose';
      span.textContent = part;
      container.appendChild(span);
    }
  });
}

/* Parse the full assistant reply into a sequence of prose + fenced blocks.
   Handles unclosed trailing fences by treating remainder as a code block
   with whatever lang was specified (or plaintext). */
function renderAssistantMarkdown(el, fullText) {
  el.textContent = '';  /* clear prior plain text */
  el.classList.add('rendered');

  const fenceRe = /```([ \t]*[A-Za-z0-9+#_.\-]*)[ \t]*\r?\n([\s\S]*?)(?:```|$)/g;
  let lastIndex = 0;
  let m;
  while ((m = fenceRe.exec(fullText)) !== null) {
    /* Prose before this fence */
    if (m.index > lastIndex) {
      renderInlineCode(fullText.slice(lastIndex, m.index), el);
    }
    const lang = m[1] || '';
    let body = m[2] || '';
    /* Strip a single trailing newline that's part of the fence sep, not the code. */
    if (body.endsWith('\n')) body = body.slice(0, -1);
    if (body.endsWith('\r')) body = body.slice(0, -1);
    el.appendChild(makeCodeBlock(lang, body));
    lastIndex = fenceRe.lastIndex;
  }
  /* Trailing prose after last fence */
  if (lastIndex < fullText.length) {
    renderInlineCode(fullText.slice(lastIndex), el);
  }
  thread.scrollTop = thread.scrollHeight;
}

function setBusy(b) {
  busy = b;
  ti.disabled = b;
  sendBtn.disabled = b;
  inBox.classList.toggle('busy', b);
}

function send() {
  if (busy) return;
  const txt = (ti.value || '').trim();
  if (!txt) return;
  addMsg(txt, 'sent');
  if (api) api.postMessage({ type: 'sendText', text: txt });
  ti.value = '';
  ti.style.height = '';
  setBusy(true);
}

sendBtn.onclick = send;
addBtn.onclick = () => { if (api) api.postMessage({ type: 'reset' }); thread.innerHTML = ''; addMsg('Conversation reset.', 'info'); };
document.getElementById('monitorBtn').onclick = () => { if (api) api.postMessage({ type: 'showTrace' }); };
document.getElementById('label-pill').onclick = () => { if (api) api.postMessage({ type: 'labelClick' }); };

ti.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
ti.addEventListener('input', function() {
  this.style.height = '';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});

window.addEventListener('message', e => {
  const m = e.data || {};
  if (m.type === 'assistantStart') {
    streamingEl = addMsg('', 'assistant streaming');
  } else if (m.type === 'chunk') {
    if (!streamingEl) streamingEl = addMsg('', 'assistant streaming');
    streamingEl.textContent += (m.text || '');
    thread.scrollTop = thread.scrollHeight;
  } else if (m.type === 'assistantDone') {
    if (streamingEl) {
      streamingEl.classList.remove('streaming');
      const fullText = (typeof m.text === 'string' && m.text)
        ? m.text
        : (streamingEl.textContent || '');
      try {
        renderAssistantMarkdown(streamingEl, fullText);
      } catch (e) {
        /* Rendering failed — fall back to plain text so the user still sees the reply. */
        streamingEl.textContent = fullText;
      }
      streamingEl = null;
    }
    setBusy(false);
    ti.focus();
  } else if (m.type === 'error') {
    if (streamingEl) { streamingEl.classList.remove('streaming'); streamingEl = null; }
    addMsg('⚠ ' + (m.message || 'error'), 'error');
    setBusy(false);
  } else if (m.type === 'info') {
    addMsg(m.text || '', 'info');
  }
});
</script>
</body>
</html>
