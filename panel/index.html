<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- CSP: allow scripts/styles/images/media from the webview origin + the
     inline <script> block. {{CSP_SOURCE}} is replaced by extension.js with
     webview.cspSource. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{CSP_SOURCE}} https://*.vscode-cdn.net data:; script-src {{CSP_SOURCE}} https://*.vscode-cdn.net 'unsafe-inline'; style-src {{CSP_SOURCE}} https://*.vscode-cdn.net 'unsafe-inline'; font-src {{CSP_SOURCE}} https://*.vscode-cdn.net data:; media-src {{CSP_SOURCE}} https://*.vscode-cdn.net blob: data:; frame-src {{CSP_SOURCE}} https: data:;" />
<title>Claude Codex Black</title>
<!-- Prism CSS deferred: load with media="print" (non-blocking), then JS swaps
     to media="all" once loaded. The chat thread is rendered without code-block
     styling for the first ~100ms — acceptable because there are no code
     blocks at boot. -->
<link rel="stylesheet" href="{{PRISM_CSS_URI}}" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="{{PRISM_CSS_URI}}" /></noscript>
<style>
  /* ── Panel shell + chat thread (GPT's prompt-bar design, hooked into the
     extension's JS via #promptBox / #sendBtn / #addBtn / #sttBtn / #ttsBtn /
     #label-pill / #storedPromptsBtn / #autoReplyBtn) ──────────────────── */
:root {
  --shell-radius: 14px;
  --input-radius: 10px;
  --button-radius: 10px;
  --orange-1: #ffcc00;
  --orange-2: #ff8b00;
  --orange-3: #ff5b00;
  --orange-4: #dc3000;
  --orange-5: #9f1600;
  --ink: #111111;

  /* Modal chrome — defaults match the original Codex Black orange-on-black
     look. Skins push their own values onto :root via manifest.xml so the
     same modal markup re-paints in the theme's accent without rewriting
     any modal HTML or JS. */
  --cbe-modal-bg:         #1a1a1a;
  --cbe-modal-fg:         #e8e8e8;
  --cbe-modal-border:     #e8621a;
  --cbe-modal-title-bg-1: #b83c00;
  --cbe-modal-title-bg-2: #e8621a;
  --cbe-modal-title-fg:   #ffffff;
  --cbe-modal-foot-bg:    #111111;
  --cbe-modal-accent:     #e8621a;
  /* Universal high-contrast accent. Read from manifest.xml -> <highlight-color>
     so each skin gets a pop-color that reads cleanly on its modal-bg. */
  --cbe-highlight-color:  #ffd166;

  /* Code-block chrome (title bar above + footer below fenced code). Skins
     override via manifest.xml <code-bar-bg>/<code-bar-fg>. Defaults chain
     off the modal title palette so an un-themed skin still looks cohesive. */
  --cbe-code-bar-bg:      var(--cbe-modal-title-bg-2);
  --cbe-code-bar-fg:      var(--cbe-modal-title-fg);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  /* No background / color set — chat thread shows default browser/system
     rendering (white bg, black text). The prompt-area provides its own
     dark gradient locally, so removing the body's #0a0a0a doesn't affect
     the floating prompt look. */
  font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* Fullscreen chat thread + floating prompt overlay. The thread fills the
   entire viewport; the prompt-area is position:fixed at the bottom and
   floats over the thread (bottom-edge gradient so chat doesn't visibly
   bleed through the prompt). */
.demo-stage {
  height: 100vh;
  width: 100vw;
  position: relative;
  overflow: hidden;
}

/* Prompt-area: fixed at the bottom of the viewport, FLOATING over the
   fullscreen chat thread. Transparent backdrop so the chat shows through
   around the rounded prompt-shell. */
/* Prompt-area: fixed at the bottom of the viewport, FLOATING over the
   fullscreen chat thread. Fully transparent so the chat's sideBar bg
   shows through cleanly — the orange prompt-shell provides all the
   visible chrome. */
.prompt-area {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  /* Horizontal padding shrinks aggressively below 1280px so the prompt-shell
     can render at the panel's true usable width on narrow VSCode sidebars.
     Was a flat `14px 100px 22px` which ate 200px of horizontal space, pushing
     the toolbar contents off-screen on panels under ~700px wide. */
  padding: 14px 24px 22px;
  z-index: 10;
  pointer-events: none;
  background: transparent;
}
.prompt-area > * { pointer-events: auto; }

.prompt-shell {
  width: 100%;
  max-width: 1935px;
  margin: 0 auto;
  position: relative;
  padding: 14px 26px 22px;
  border-radius: var(--shell-radius);
  border: 2px solid rgba(255, 192, 40, 0.95);
  background:
    linear-gradient(180deg, rgba(255, 224, 75, 0.9) 0%, rgba(255, 186, 0, 0.82) 2.5%, rgba(255, 138, 0, 0.88) 6%, rgba(255, 92, 0, 0.94) 32%, rgba(226, 51, 0, 0.97) 68%, rgba(167, 24, 0, 1) 100%);
  box-shadow:
    0 0 0 3px rgba(255, 94, 0, 0.95),
    0 0 16px rgba(255, 160, 0, 0.95),
    0 0 34px rgba(255, 86, 0, 0.82),
    0 22px 40px rgba(0, 0, 0, 0.62);
}

.prompt-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow:
    inset 0 2px 0 rgba(255, 240, 170, 0.75),
    inset 0 -2px 0 rgba(120, 0, 0, 0.3);
}

.prompt-input-wrap {
  position: relative;
  /* Center the textarea vertically inside the wrap so the prompt text never
     sits jammed against the top edge when a skin makes the wrap taller than
     the textarea's own height (user 2026-05-22: "prompt text is up too
     high"). The send button is position:absolute so it stays out of flow. */
  display: flex;
  align-items: center;
  margin-bottom: 17px;
  border-radius: var(--input-radius);
  border: 2px solid rgba(52, 52, 52, 0.95);
  background: linear-gradient(180deg, #f7f7f7 0%, #f1f1f1 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 1px 0 rgba(0, 0, 0, 0.25),
    0 3px 10px rgba(0, 0, 0, 0.12);
  padding: 14px 90px 14px 23px;
  /* Force the input-wrap into its own block, never sized larger than the
     shell interior. min-width:0 lets long unbreakable strings inside the
     textarea (URLs etc.) stay inside the wrap instead of pushing the wrap
     wider than its parent. width:100% pins the wrap to the shell width so
     skins that try to use width:auto can't accidentally let it expand past
     the toolbar row below. */
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
}

.prompt-input {
  width: 100%;
  /* min-height kept tight (single text line) so the textarea collapses to
     its content; the wrap's `display:flex; align-items:center` then keeps
     the text vertically centered in the pill instead of hugging the top
     (user 2026-05-22: "prompt text is up too high"). Multi-line input still
     auto-grows up to max-height via the resize JS. */
  min-height: 30px;
  max-height: 240px;
  resize: none;
  overflow: hidden;
  border: 0;
  outline: 0;
  background: transparent;
  color: #3c3c3c;
  font-size: 18px;
  font-weight: 400;
  line-height: 1.34;
}
/* Universal monospace stack. Covers Latin + Arabic + CJK + Devanagari etc.
   Consolas / Cascadia / Courier New are LATIN-ONLY — for Arabic the browser
   falls back to a proportional UA font, breaking layout. "Noto Sans Mono"
   ships with full Arabic + CJK + Devanagari + Hebrew coverage; "Sarasa Mono"
   covers CJK; "DejaVu Sans Mono" covers Cyrillic + Arabic; everything else
   is the standard Latin fallback chain. */
:root {
  --cbe-monospace: var(--vscode-editor-font-family),
    "Noto Sans Mono", "Sarasa Mono SC", "Sarasa Term SC",
    "DejaVu Sans Mono", "Liberation Mono", "Cascadia Mono", "Cascadia Code",
    Consolas, "Courier New", ui-monospace, monospace;
}
/* Maximum-specificity monospace lock for the prompt textarea.
   Stacked selectors so this beats ANY .tool-button / .prompt-input /
   media-query override in the cascade. The `font` SHORTHAND is what
   actually wins here because shorthand always re-sets all sub-properties
   atomically — and we put it on a selector at higher specificity than
   `.prompt-input` AND mark it `!important` AND repeat font-family
   immediately after as a longhand !important so any later `font:` reset
   can't strip it. */
html body .prompt-input-wrap textarea.prompt-input#promptBox,
html body textarea#promptBox.prompt-input {
  font-family: var(--cbe-monospace) !important;
  /* NOTE: font-size is intentionally OMITTED here so the scaled
     `.prompt-input { font-size: calc(20px * var(--cb-font-scale)) }` rule
     wins. An earlier `font:` shorthand baked 18px in and broke the big-font
     toggle — do not re-introduce a shorthand here. */
  font-weight: 400 !important;
  line-height: 1.34 !important;
  /* unicode-bidi:plaintext lets Arabic text auto-flip to RTL inline while
     leaving the surrounding LTR layout intact. */
  unicode-bidi: plaintext;
}
.prompt-input::placeholder { color: #434343; opacity: 1;
  font-family: var(--cbe-monospace) !important; }
/* Catch-all selector for everything else that should be monospace —
   git modal input, auto-prompt textarea, code/kbd/pre, chat-bubble code
   blocks, terminal-ish elements. Any element with the data-cbe-mono
   attribute, plus the standard semantic monospace tags, picks up the
   full-coverage stack without per-rule font-family declarations. */
code, kbd, pre, samp, tt, .cbe-mono, [data-cbe-mono],
#cbe-git-input, #cbe-ap-text, #cbe-ap-secs, #cbe-set-language-trigger,
.msg pre, .msg code, .msg kbd, .msg .hljs, .msg .language- {
  font-family: var(--cbe-monospace) !important;
}

.send-button {
  position: absolute;
  top: 50%;
  right: 16px;
  width: 44px;
  height: 44px;
  opacity: 0.8;
  margin: 0;
  transform: translateY(-50%);
  border: 0;
  background: transparent url('{{ASSETS_BASE}}/send.png') center/contain no-repeat;
  cursor: pointer;
  /* Guarantee the send button paints above the textarea and above the
     prompt-input-wrap's inset shadow pseudo regardless of stacking-context
     quirks introduced by skins. Without an explicit z-index here, skins that
     set `position: relative` on `.prompt-input` (terminal/xfce) can cause the
     textarea to win the stacking-order tie at z-index:auto. */
  z-index: 2;
}
.send-button:hover,
.send-button.is-hover { background-image: url('{{ASSETS_BASE}}/send_over.png'); }
.send-button:active,
.send-button.is-active { background-image: url('{{ASSETS_BASE}}/send_click.png'); }
/* SKIN-PROOF ARROW OVERLAY — the PNGs above can render invisible when a
   skin's send-button background-color/gradient washes them out (white-on-
   white, glass-on-glass, etc). This pseudo-element draws a CRISP upward
   chevron via SVG mask-image, tinted white with a dark drop-shadow so it
   reads on ANY background. mask-image lets the button's own background
   show through everywhere except the arrow shape. */
.send-button::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-color: #ffffff;
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 4 L4 14 H9 V20 H15 V14 H20 Z' fill='black'/></svg>");
          mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 4 L4 14 H9 V20 H15 V14 H20 Z' fill='black'/></svg>");
  -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
  -webkit-mask-position: center;
          mask-position: center;
  -webkit-mask-size: 52% 52%;
          mask-size: 52% 52%;
  filter:
    drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55))
    drop-shadow(0 0 2px rgba(0, 0, 0, 0.45));
}
.send-button:active::before,
.send-button.is-active::before {
  /* slight push-in feedback on click so the arrow tracks the press */
  transform: translateY(1px) scale(0.97);
}

/* SEND BUTTON — universal lock. ID specificity (#sendBtn) beats every skin's
   `.send-button { ... !important }` rule, so this wins regardless of the
   active skin. Keeps the button SQUARE (no circular orb), a touch smaller,
   and stacked above the panel chrome so it never gets clipped behind the
   prompt-shell (user 2026-05-22: "send button should be square",
   "smaller and not behind the panel"). */
#sendBtn {
  width: 38px !important;
  height: 38px !important;
  border-radius: 4px !important;
  opacity: 0.9 !important;
  z-index: 6 !important;
}
#sendBtn::before {
  -webkit-mask-size: 58% 58%;
          mask-size: 58% 58%;
}

/* Attachments row — sits between the input and the toolbar. Each chip
   is a queued file the user has attached; the red minus button on each
   chip removes it. The row collapses to zero height when there are no
   attachments. */
.attachments {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0;
  margin: 0;
  min-height: 0;
  transition: margin .12s ease;
}
.attachments:not(:empty) {
  margin: 6px 0 10px 0;
}
.attach-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  max-width: 240px;
  padding: 0 6px 0 10px;
  background: rgba(0, 0, 0, 0.32);
  border: 1px solid rgba(255, 160, 30, 0.55);
  border-radius: 8px;
  color: #ffe4c8;
  font-family: Consolas, "Fira Mono", monospace;
  font-size: 12px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
}
.attach-chip .attach-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.attach-chip .attach-size {
  color: #ffb060;
  opacity: 0.75;
  font-size: 11px;
}
.attach-chip .attach-remove {
  all: unset;
  cursor: pointer;
  width: 20px; height: 20px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center; justify-content: center;
  flex: 0 0 auto;
}
.attach-chip .attach-remove:hover { background: rgba(255, 56, 56, 0.18); }
.attach-chip .attach-remove svg { display: block; }

.prompt-toolbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 60px;
  /* Establish a stacking context BELOW the prompt-input-wrap's send button
     but ABOVE the prompt-shell's ::before glow pseudo. Combined with
     position:relative this guarantees that nothing in the toolbar can be
     painted over by a stray absolute-positioned sibling. */
  position: relative;
  z-index: 1;
  width: 100%;
  min-width: 0;
}
/* macOS-dock styled toolbar row. The .toolbar-tools element is now the
   translucent dock STRIP — one rounded frosted-glass panel that all the
   icons sit on directly (no per-icon button container). Wraps to multiple
   rows when there isn't enough horizontal room, so we never lose buttons
   off-screen the way overflow-x:auto did. */
.toolbar-tools {
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px;
  row-gap: 14px;
  width: fit-content;
  max-width: 100%;
  min-width: 0;
  margin: 0 auto;
  padding: 10px 16px 18px 16px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.28);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.45),
    inset 0 -1px 0 rgba(0, 0, 0, 0.18),
    0 10px 32px rgba(0, 0, 0, 0.42),
    0 2px 6px rgba(0, 0, 0, 0.25);
  overflow: visible;
}
.toolbar-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
}
.toolbar-meta > .project-path { margin: 0 auto; }

.toolbar-spacer { display: none; }

/* Auto-read-aloud spinner overlay — sits over the TTS button. Hidden
   until #ttsBtn has the `.autoread` class (toggled by right-click).
   Pointer-events:none so it never steals clicks from the underlying
   tts icon. */
#ttsBtn { position: relative; }
#ttsBtn .cbe-autoread-ring {
  /* Center the autoread ring SVG over the button. Same fix as #monitorBtn
     / #sttBtn / #autoReplyBtn — skins set `.tool-button img !important`
     which overrides plain `inset/width/height` unless ours is also
     `!important`. Switching from `inset:0 + 100%` to 50/50 + translate
     guarantees centering at any button size. */
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  width: 100% !important;
  height: 100% !important;
  transform: translate(-50%, -50%) scale(0.85) !important;
  pointer-events: none;
  opacity: 0;
  transition: opacity .18s ease, transform .18s ease, filter .18s ease;
  /* Outer glow + drop shadow stack — the SVG has its own internal glow
     filter but this extra CSS halo punches through the dark button. */
  filter: drop-shadow(0 0 6px rgba(63, 165, 255, 0.85))
          drop-shadow(0 0 14px rgba(20, 102, 255, 0.55));
}
#ttsBtn.autoread .cbe-autoread-ring {
  opacity: 1;
  /* Stay centered while pulsing — translate(-50%,-50%) keeps the SVG
     anchored at the button center regardless of the scale tween. */
  transform: translate(-50%, -50%) scale(1.06) !important;
}
/* While auto-read is active also pulse the underlying tts icon subtly so
   the whole button reads as "listening for the next reply". */
#ttsBtn.autoread > img:first-of-type {
  animation: cbe-autoread-pulse 1.6s ease-in-out infinite;
}
@keyframes cbe-autoread-pulse {
  0%, 100% { filter: brightness(1) drop-shadow(0 0 0 rgba(63,165,255,0)); }
  50%      { filter: brightness(1.25) drop-shadow(0 0 8px rgba(63,165,255,0.9)); }
}

/* Top-right floating Help button (lives in .demo-stage, NOT in the toolbar
   — it's a meta-action that should sit over the chat thread out of the
   way of the active tool cluster). */
.top-help-btn {
  position: absolute;
  top: 14px; right: 14px;
  width: 44px; height: 44px;
  border-radius: 12px;
  border: 2px solid rgba(255, 160, 30, 0.96);
  background:
    linear-gradient(180deg, rgba(255, 145, 0, 1) 0%, rgba(255, 112, 0, 0.98) 25%, rgba(242, 71, 0, 0.98) 100%);
  box-shadow:
    inset 0 2px 0 rgba(255, 209, 100, 0.75),
    inset 0 -3px 0 rgba(150, 27, 0, 0.38),
    0 0 0 1px rgba(130, 30, 0, 0.5),
    0 5px 10px rgba(0, 0, 0, 0.22),
    0 0 14px rgba(255, 94, 0, 0.38);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
  transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
  z-index: 20;
}
.top-help-btn img {
  width: 22px; height: 22px; display: block;
  filter: brightness(0) invert(1);
}
.top-help-btn:hover {
  transform: translateY(-2px) scale(1.06);
  filter: brightness(1.10);
  box-shadow:
    inset 0 2px 0 rgba(255, 240, 175, 0.95),
    inset 0 -2px 0 rgba(170, 33, 0, 0.5),
    0 0 0 2px rgba(255, 200, 50, 0.5),
    0 10px 22px rgba(0, 0, 0, 0.45),
    0 0 30px rgba(255, 150, 30, 0.85);
}
.top-help-btn:active { transform: translateY(1px) scale(0.96); filter: brightness(.86); }

.tool-button,
.label-button,
.stop-button {
  appearance: none;
  border: 0;
  cursor: pointer;
  padding: 0;
  background: transparent;
}

/* macOS-dock icon. No button container, no border, no gradient — just an
   icon sitting on the dock glass with a soft mirror reflection beneath it
   and classic Mac scale-up magnification on hover. */
.tool-button {
  width: 48px;
  height: 48px;
  flex: 0 0 auto;
  border: 0;
  background: transparent;
  box-shadow: none;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  /* Origin at bottom-center so the magnify grows UP off the dock floor,
     the way real macOS does it. */
  transform-origin: 50% 100%;
  transform: scale(1);
  transition-property: transform, filter;
  transition-duration: .15s;
  transition-timing-function: cubic-bezier(.2, .8, .2, 1);
}

/* Defensive home-state reset — keeps the icon snapping back to rest when
   no state class is active (matches the prior :not() reset pattern that
   protects against "stuck pressed" artifacts on skin swaps). */
.tool-button:not(:hover):not(:active):not(.is-active):not(.autoread):not(.is-recording):not(.is-monitoring):not(.is-autoprompting) {
  transform: scale(1);
}

.tool-button:hover {
  transform: scale(1.28);
  filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
  z-index: 2;
}

.tool-button:active,
.tool-button.is-active {
  transform: scale(1.12);
  filter: brightness(.92) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
}

.tool-button img {
  width: 40px;
  height: 40px;
  display: block;
  /* Render icons in full color (no white-out tint). Slight drop-shadow gives
     them depth on the glass. image-rendering keeps PNG icons crisp at the
     larger dock size. */
  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.55))
          drop-shadow(0 1px 1px rgba(0, 0, 0, 0.35));
  image-rendering: -webkit-optimize-contrast;
  -webkit-user-drag: none;
  user-select: none;
}

/* Pinned-extension buttons (calculator / minesweeper / emoji-picker, plus
   any user-pinned extension) carry the same `.tool-button` class as every
   other dock icon, but their glyph lives in an inline-styled <span> wrapper.
   Force that wrapper's inner <svg> to fill the 40px slot so these buttons
   match the rest of the toolbar instead of rendering visibly smaller
   (user 2026-05-22: "the last 4 buttons are too small"). */
.cbe-pinned-ext .cbe-pinned-svg svg {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

/* Mirror-flipped icon reflection beneath each dock icon. Uses the same
   <img> the button already contains, cloned via ::after's content:''
   trick: we paint an inverted, faded copy positioned just below the icon
   with a mask-gradient so it dissolves into transparent at the bottom.
   We use background-image inheritance from the parent button via a CSS
   custom property set by JS would be ideal, but we don't have that hook —
   instead we use a subtle generic reflection by mirroring the icon's
   own drop-shadow with `transform: scaleY(-1)` on a clone. Since the
   actual <img> is the only icon source we have, the cleanest pure-CSS
   reflection is to duplicate the icon visually using the button's
   `::after` with a hard-coded ratio. As a fallback that always works,
   we use a soft elliptical glow as the "reflection" — matches how the
   reference Mac dock fades the icon glow into the glass. */
.tool-button::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -10px;
  width: 36px;
  height: 6px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center,
              rgba(255, 255, 255, 0.35) 0%,
              rgba(255, 255, 255, 0.12) 45%,
              rgba(255, 255, 255, 0) 75%);
  border-radius: 50%;
  pointer-events: none;
  opacity: 0.9;
  transition: opacity .15s ease, transform .15s ease;
}
.tool-button:hover::after {
  opacity: 1;
  transform: translateX(-50%) scale(1.28);
}

/* Monitor "working" overlay — when the panel is busy (in-flight request),
   a blue spinning ring is drawn over the VSCode-monitor icon so the user
   has visual confirmation that the extension is processing. */
#monitorBtn { position: relative; display: inline-flex !important; align-items: center !important; justify-content: center !important; }
#monitorBtn .cbe-spinner {
  /* Center an explicitly-sized SVG over the button regardless of which
     skin is active. Skins apply `.tool-button img { width:20px !important }`
     which beats ID-scoped rules without !important — so every geometry
     property here is `!important` too. A FIXED 22x22 box (not a %) keeps
     the ring a perfect circle and dead-centered even if the button is not
     square; margin:0 cancels any skin img margin that would shift it. */
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  width: 43px !important;
  height: 43px !important;
  min-width: 43px !important;
  min-height: 43px !important;
  max-width: 43px !important;
  max-height: 43px !important;
  margin: 0 !important;
  padding: 0 !important;
  transform: translate(-50%, -50%) !important;
  transform-origin: center center !important;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s ease;
  filter: none !important;          /* don't get re-tinted by .tool-button img */
}
#monitorBtn.is-monitoring .cbe-spinner { opacity: 1; }
#monitorBtn.is-monitoring > img:first-of-type {
  opacity: 0.45;
  filter: brightness(0) invert(1) drop-shadow(0 0 6px rgba(255,139,0,0.65));
}

/* Auto Prompt button — visually identical to the TTS auto-read pulsing
   ring while a loop is running. Same SVG (auto_read_spinner.svg), same
   drop-shadow halo, same scale tween. Skins' `.tool-button img !important`
   gets out-prioritized via !important on every geometry property + an
   explicit `filter: drop-shadow…` (replacing skin filters entirely). */
#autoReplyBtn { position: relative; }
#autoReplyBtn .cbe-spinner {
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  width: 100% !important;
  height: 100% !important;
  transform: translate(-50%, -50%) scale(0.85) !important;
  pointer-events: none;
  opacity: 0;
  transition: opacity .18s ease, transform .18s ease, filter .18s ease;
  /* Blue glow stack — punches through dark buttons regardless of skin. */
  filter: drop-shadow(0 0 6px rgba(63, 165, 255, 0.85))
          drop-shadow(0 0 14px rgba(20, 102, 255, 0.55)) !important;
}
#autoReplyBtn.is-autoprompting .cbe-spinner {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1.06) !important;
}
/* Pulse the underlying auto_reply icon subtly so the whole button reads
   as "actively firing prompts" — mirrors the .autoread > img treatment. */
#autoReplyBtn.is-autoprompting > img:first-of-type {
  animation: cbe-autoprompt-pulse 1.6s ease-in-out infinite;
}
@keyframes cbe-autoprompt-pulse {
  0%, 100% { filter: brightness(1) drop-shadow(0 0 0 rgba(63,165,255,0)); }
  50%      { filter: brightness(1.25) drop-shadow(0 0 8px rgba(63,165,255,0.9)); }
}
/* Countdown badge — top-right corner of the Auto Prompt button when a
   loop is running. The DIGITS are painted in the skin's
   --cbe-highlight-color (per user request) so they pop hard regardless
   of theme. Backed by a translucent dark disc so the highlight color
   reads cleanly on light skins too (Adwaita / Office / Red Hat etc). */
#autoReplyBtn .cbe-countdown {
  position: absolute;
  top: -5px;
  right: -5px;
  min-width: 20px;
  height: 20px;
  padding: 0 4px;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.78);
  color: var(--cbe-highlight-color, #ffd166);
  font: 800 12px/20px Consolas, "Cascadia Mono", "Courier New", monospace;
  text-align: center;
  pointer-events: none;
  border: 1px solid var(--cbe-highlight-color, #ffd166);
  box-shadow: 0 0 6px rgba(0, 0, 0, .55),
              0 0 4px var(--cbe-highlight-color, #ffd166);
  display: none;
}
#autoReplyBtn.is-autoprompting .cbe-countdown { display: inline-block; }

/* Compact button — context-usage ring. Conic gradient fills clockwise from
   12 o'clock proportional to --cbe-ctx-ratio (0..1, set inline by panel.js
   on every assistantDone). Sits behind the icon so the original SVG stays
   visible; ring color is --cbe-modal-accent which matches the active skin. */
#compactBtn { position: relative; }
#compactBtn .cbe-ctx-ring {
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  width: 88% !important;
  height: 88% !important;
  transform: translate(-50%, -50%) !important;
  border-radius: 50%;
  pointer-events: none;
  /* Default ratio = 0 → fully transparent ring. */
  background: conic-gradient(
      var(--cbe-modal-accent, #e8621a) 0deg,
      var(--cbe-modal-accent, #e8621a) calc(var(--cbe-ctx-ratio, 0) * 360deg),
      transparent calc(var(--cbe-ctx-ratio, 0) * 360deg),
      transparent 360deg
  );
  /* Mask to draw only a 3px-thick ring at the rim, not a solid disc. */
  -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%, #000 78%, transparent 80%);
          mask: radial-gradient(circle, transparent 58%, #000 60%, #000 78%, transparent 80%);
  opacity: 0;
  transition: opacity .2s ease;
}
/* Only show the ring once we've received at least one usage update. The
   class is added by panel.js when ratio > 0. */
#compactBtn.has-ctx-ratio .cbe-ctx-ring { opacity: 1; }
/* Warn color above 75% — turns red so the user sees they should compact. */
#compactBtn.ctx-warn .cbe-ctx-ring {
  background: conic-gradient(
      #ff5050 0deg,
      #ff5050 calc(var(--cbe-ctx-ratio, 0) * 360deg),
      transparent calc(var(--cbe-ctx-ratio, 0) * 360deg),
      transparent 360deg
  );
}

/* STT "recording" overlay — when the mic button is actively listening
   (either Web Speech API in-webview or the host-side SAPI fallback), the
   same blue ring used for #monitorBtn spins over the mic icon. Mirrors
   the #monitorBtn rules above so the visual language is consistent. */
#sttBtn { position: relative; }
#sttBtn .cbe-spinner {
  /* See #monitorBtn .cbe-spinner — every geometry property is !important
     to beat skin's `.tool-button img { ... !important }`. */
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  width: 70% !important;
  height: 70% !important;
  transform: translate(-50%, -50%) !important;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s ease;
  filter: none !important;
}
#sttBtn.is-recording .cbe-spinner { opacity: 1; }
#sttBtn.is-recording > img:first-of-type {
  opacity: 0.45;
  filter: brightness(0) invert(1) drop-shadow(0 0 6px rgba(78,168,255,0.6));
}

/* label.png has built-in transparent padding around the orange pill, and
   the button itself is 280×56. A `box-shadow` on the button traces the
   invisible bounding box and leaves a visible gap between the pill and
   its shadow. Using `filter: drop-shadow()` on the IMG instead follows
   the actual non-transparent pixels (the pill silhouette), so the shadow
   sits flush against the pill. `overflow: visible` keeps the shadow from
   being clipped by the button. */
.label-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 320px;
  height: 48px;
  background: transparent;
  border: none;
  padding: 0;
  overflow: visible;
  transition: transform .14s ease;
}
.label-button img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.45));
  transition: filter .14s ease;
}
.label-button:hover { transform: translateY(-1px); }
.label-button:hover img {
  filter:
    brightness(1.12)
    drop-shadow(0 7px 10px rgba(0, 0, 0, 0.55))
    drop-shadow(0 0 14px rgba(255, 150, 30, 0.55));
}
.label-button:active { transform: translateY(1px); }
.label-button:active img {
  filter: brightness(.92) drop-shadow(0 3px 5px rgba(0, 0, 0, 0.40));
}

/* Active project folder pill — sits between the Codex label-pill and the
   Stop button. Monospace + min-width:0 + overflow:hidden so it never
   pushes the toolbar wider than the prompt-shell; the JS does middle-
   truncation to fit whatever width is left. */
.project-path {
  flex: 0 1 auto;
  min-width: 60px;
  max-width: 360px;
  height: 36px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  border-radius: 10px;
  border: 1px solid rgba(0,0,0,0.35);
  background: rgba(0,0,0,0.32);
  color: #ffe4c8;
  font-family: Consolas, "Fira Mono", "Liberation Mono", "Courier New", monospace;
  font-size: 13px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  user-select: text;
  cursor: default;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 -1px 0 rgba(0,0,0,0.35);
}
.project-path:empty::before {
  content: 'no project folder';
  color: #ffd09e;
  opacity: 0.55;
  font-style: italic;
  font-family: Inter, system-ui, sans-serif;
}

.stop-button {
  height: 48px;
  padding: 0 18px;
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: #f3f3f3;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .01em;
  border: 1px solid rgba(255,255,255,0.12);
  background:
    linear-gradient(180deg, rgba(42, 42, 42, 0.92) 0%, rgba(18, 18, 18, 0.96) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.24),
    inset 0 -2px 0 rgba(0,0,0,0.45),
    0 6px 14px rgba(0,0,0,0.35);
}
.stop-button {
  transition: transform .14s ease, filter .14s ease, box-shadow .14s ease;
}
.stop-button:hover {
  filter: brightness(1.18);
  transform: translateY(-1px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.30),
    inset 0 -2px 0 rgba(0,0,0,0.50),
    0 8px 18px rgba(0,0,0,0.50),
    0 0 18px rgba(255, 80, 80, 0.30);
}
.stop-button:active { transform: translateY(1px); filter: brightness(.86); }

.stop-button__icon {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  background: #f3f3f3;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.35), 0 0 8px rgba(255,255,255,0.1);
}

.tooltip {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transform: translate(-9999px, -9999px);
  padding: 9px 12px;
  border-radius: 10px;
  color: #f2f2f2;
  background: rgba(15, 15, 15, 0.95);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 10px 18px rgba(0,0,0,0.45);
  font-size: 13px;
  line-height: 1.2;
  transition: opacity .12s ease;
}
.tooltip.is-visible { opacity: 1; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 1280px) {
  .demo-stage { padding: 20px 40px 40px 40px; }
  .label-button { width: 220px; }
  /* Tighten the prompt-area gutter on mid-width panels so the toolbar buttons
     have more room to lay out before wrap kicks in. */
  .prompt-area { padding: 14px 18px 18px; }
}

@media (max-width: 880px) {
  .demo-stage { padding: 16px 20px 20px 20px; }
  .prompt-input { font-size: 16px; }
  /* Narrow panels: keep the macOS-dock icon size slightly smaller but
     never shrink to the 22px "tiny chip" look — the dock should still
     read as a row of full-color app icons on translucent glass. */
  .tool-button { width: 42px; height: 42px; }
  .tool-button img { width: 34px; height: 34px; }
  .tool-button:hover { transform: scale(1.22); }
  .toolbar-tools { padding: 8px 12px 14px 12px; border-radius: 18px; gap: 2px; }
  .stop-button { height: 34px; font-size: 13px; }
  .label-button { width: 180px; height: 34px; }
  /* Narrow VSCode sidebars get an even tighter gutter + shell padding so
     the toolbar can still fit ~6 buttons per row at 42px before wrapping. */
  .prompt-area { padding: 10px 10px 14px; }
  .prompt-shell { padding: 12px 14px 18px; }
  .prompt-input-wrap { padding: 12px 76px 12px 16px; }
}

  /* CBE extension hooks added to GPT's design */
  :root { --cb-font-scale: 1; }
  body.cb-big { --cb-font-scale: 1.8; }
  .prompt-input { font-size: calc(20px * var(--cb-font-scale)); }
  .stop-button { font-size: calc(14px * var(--cb-font-scale)); }

  /* Anthropic's Claude Code extension :root variables — copied byte-for-byte
     from `~/.vscode/extensions/anthropic.claude-code-*/webview/index.css`.
     Defining these on :root means our chat thread renders with the exact
     same palette + spacing tokens as the official extension. */
  :root {
    --app-primary-foreground: var(--vscode-foreground);
    --app-primary-background: var(--vscode-sideBar-background);
    --app-secondary-foreground: var(--vscode-descriptionForeground);
    --app-secondary-background: var(--vscode-editor-background);
    --app-input-foreground: var(--vscode-input-foreground);
    --app-input-background: var(--vscode-input-background);
    --app-error-foreground: var(--vscode-errorForeground);
    --app-monospace-font-family: var(--vscode-editor-font-family, monospace);
    --app-monospace-font-size: var(--vscode-editor-font-size, 12px);
    --app-spacing-small: 4px;
    --app-spacing-medium: 8px;
    --app-spacing-large: 12px;
    --app-spacing-xlarge: 16px;
    --corner-radius-small: 4px;
    --corner-radius-medium: 6px;
    --corner-radius-large: 8px;
  }

  /* Chat thread — verbatim port of Anthropic's .chatContainer + .message
     rules. No message bubbles; flat blocks with 8px top/bottom padding.
     Background comes from --app-primary-background which IS the VSCode
     sideBar color — exactly what their extension renders. */
  #thread {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    /* Bottom padding budget for the prompt pill + dock at the panel
       bottom. 280px was not enough for the macOS Color Dock — its
       prompt pill + 2-row icon grid + meta row stacks to ~380-400px
       on a wide panel; messages were getting hidden underneath the
       composer. 420px covers every shipped skin as of 2026-05-19. */
    padding: 18px 18px 420px 18px;
    background: var(--app-primary-background, #f3f3f3) !important;
    color: var(--app-primary-foreground, #1f1f1f) !important;
    font-family: var(--vscode-chat-font-family, var(--vscode-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif));
    font-size: var(--vscode-chat-font-size, 13px);
    line-height: 1.5;
  }
  .msg {
    color: var(--app-primary-foreground) !important;
    background: transparent !important;
    border: 0 !important;
    display: flex;
    position: relative;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    padding: 8px 0;
  }
  .msg:first-child { padding-top: 0; }
  .msg.info { opacity: 0.62; font-style: italic; font-size: 12px; }
  .msg.error { color: var(--app-error-foreground, #b00) !important; }
  .msg.assistant.streaming::after { content: '▍'; opacity: .6; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 0%,50% { opacity: .6 } 51%,100% { opacity: 0 } }

  /* Layout: dark backdrop; .demo-stage is a column flex container with 18 px
     gutter so #thread fills the space above the prompt-shell. */
  html, body { width: 100%; height: 100%; overflow: hidden; }
  .prompt-shell { width: 100%; max-width: 1935px; margin: 0 auto; flex: 0 0 auto; }

  /* Hidden cluster: features good.png doesn't show but the extension JS still binds */
  #toolbar-hidden { display: none; }

  /* When the in-flight Claude response is busy, the input box border yellows */
  .prompt-input-wrap.busy { border-color: #d69e2e; }

  /* Stop -> Send dual-state: hide stop-button label when there's no in-flight job.
     For now leave both visible — the existing JS toggles disabled state on sendBtn. */

  /* ── Setup wizard modal ─────────────────────────────────────
     Multi-step wizard to collect API keys / PATs. Each step has Skip
     (advance without saving) and Next (save then advance). Final step
     has Done that writes config.ini and closes. */
  #cbe-setup { position: fixed; inset: 0; z-index: 2147483646;
    background: rgba(0,0,0,.65); display: flex;
    align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; }
  #cbe-setup .cbe-box { background: var(--cbe-modal-bg); border: 2px solid var(--cbe-modal-border);
    border-radius: 10px; width: 560px; max-width: 92vw;
    box-shadow: 0 12px 50px rgba(0,0,0,.7); overflow: hidden;
    display: flex; flex-direction: column; }
  #cbe-setup .cbe-hdr {
    padding: 12px 16px;
    background: linear-gradient(90deg, var(--cbe-modal-title-bg-1), var(--cbe-modal-title-bg-2)); color: var(--cbe-modal-title-fg);
    color: #fff; font-weight: 700; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center; }
  #cbe-setup .cbe-progress {
    height: 4px; background: #2a2a2a;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.4); }
  #cbe-setup .cbe-progress > span {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--cbe-modal-accent), var(--cbe-modal-title-bg-2));
    transition: width .25s ease; }
  #cbe-setup .cbe-body { padding: 22px;
    display: flex; flex-direction: column; gap: 14px;
    min-height: 200px; color: #e8e8e8; font-size: 13px; line-height: 1.5; }
  #cbe-setup .cbe-step-title { font-size: 18px; font-weight: 700; color: #ffb084; margin: 0; }
  #cbe-setup .cbe-step-desc  { opacity: .8; margin: 0; }
  #cbe-setup .cbe-step-desc a { color: #ffb084; }
  #cbe-setup label { font-size: 11px; color: #aaa;
    text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 4px; display: block; }
  #cbe-setup input[type="text"], #cbe-setup input[type="password"] {
    width: 100%; background: #0f0f0f; color: #e8e8e8;
    border: 1px solid #333; border-radius: 5px; padding: 9px 11px;
    font-family: 'Consolas','Courier New',monospace; font-size: 13px; outline: none; }
  #cbe-setup input:focus { border-color: var(--cbe-modal-accent); }
  #cbe-setup .cbe-foot { padding: 12px 16px; background: var(--cbe-modal-foot-bg);
    border-top: 1px solid #2a2a2a;
    display: flex; justify-content: space-between; gap: 8px; }
  #cbe-setup .cbe-foot-left  { display: flex; gap: 8px; }
  #cbe-setup .cbe-foot-right { display: flex; gap: 8px; }
  #cbe-setup button.cbe-btn { font-family: system-ui, sans-serif;
    border: none; cursor: pointer; padding: 8px 18px;
    border-radius: 5px; font-size: 13px; font-weight: 600; }
  #cbe-setup button.cbe-skip { background: #2a2a2a; color: #ccc; }
  #cbe-setup button.cbe-skip:hover { background: #3a3a3a; }
  #cbe-setup button.cbe-next { background: var(--cbe-modal-accent); color: var(--cbe-modal-title-fg); }
  #cbe-setup button.cbe-next:hover { background: #ff7a1a; }
  #cbe-setup button.cbe-back { background: transparent; color: #888; }
  #cbe-setup button.cbe-back:hover { color: #ccc; }

  /* ── Settings modal ──────────────────────────────────────── */
  #cbe-settings { position: fixed; inset: 0; z-index: 2147483645;
    background: rgba(0,0,0,.65); display: flex;
    align-items: center; justify-content: center; }
  #cbe-settings .cbe-box { background: var(--cbe-modal-bg); border: 2px solid var(--cbe-modal-border);
    border-radius: 8px; width: 420px; max-width: 90vw;
    box-shadow: 0 8px 40px rgba(0,0,0,.6); overflow: hidden; }

    color: #fff; font-family: system-ui, sans-serif; font-weight: 700;

  #cbe-settings button.cbe-cancel { background: #2a2a2a; color: #ddd; }

  #cbe-settings button.cbe-save:hover { background: #ff7a1a; }

  /* ── Accounts modal (standalone — toolbar #accountsBtn) ──────
     Mirrors the Settings-modal chrome (.cbe-box / .cbe-hdr / .cbe-body /
     .cbe-foot) so it re-themes off the active skin's --cbe-modal-* vars
     with zero per-skin work. Hidden by default; panel.js flips display. */
  #accountsModal { position: fixed; inset: 0; z-index: 2147483645;
    background: rgba(0,0,0,.65); display: none;
    align-items: center; justify-content: center; }
  #accountsModal.show { display: flex; }

  /* Shared SVG "X" close button (font-independent — no tofu/box if a font

     Drop the `.cbe-x` or `.cbe-x-svg` class on a <button> with EMPTY text. */
  .cbe-x, .cbe-x-svg {
    all: unset; cursor: pointer;
    width: 26px; height: 26px;
    display: inline-block;
    /* URL-encoded `<` `>` (was raw — VSCode webview's strict CSP/parser
       rejected the malformed data URI, the SVG failed to load, and the close
       button rendered as a solid box with no X — user 2026-05-22: "X IS MAGIC
       BOXING"). Encoded form loads in every browser including the webview. */
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath stroke='%23ffffff' stroke-width='2.4' stroke-linecap='round' fill='none' d='M6 6L18 18M18 6L6 18'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 14px 14px;
    background-color: transparent;
    border-radius: 4px;
    transition: background-color .12s ease;
  }
  .cbe-x:hover, .cbe-x-svg:hover { background-color: rgba(255,255,255,.18); }
  .cbe-x:active, .cbe-x-svg:active { background-color: rgba(0,0,0,.28); }

    padding: 1px 5px; border-radius: 3px; border: 1px solid #e3dfd9;
    font-family: 'Consolas','Fira Code',monospace; font-size: 12px; }
  /* Final-rendered assistant msg should not pre-wrap (mixed block/inline) */
  .msg.assistant.rendered { white-space: normal; }
  .msg.assistant.rendered .cv-prose { white-space: pre-wrap; }
</style>
<!-- Skin override stylesheet — href set at runtime when the user picks a skin
     from Settings. Empty href = no skin. Loaded AFTER the inline <style>
     above so skin rules win the cascade. -->
<link id="cbe-skin" rel="stylesheet" href="" />
</head>
<body>
  <main class="demo-stage" id="app">
    <div id="thread">
      <div class="msg info">Claude Codex Black — standalone. Type to send. First send will prompt for your API key.</div>
    </div>


    <div class="prompt-area">
      <section class="prompt-shell" aria-label="Prompt composer">
        <div class="prompt-input-wrap" id="input-box">
          <label class="sr-only" for="promptBox">Message</label>
          <!-- promptBox: rebuilt with a fresh id so no stale CSS targeting
               the old #textInput can interfere. Monospace is baked into
               style="" inline — that's higher origin than any external
               sheet, !important or not. Class kept so layout rules still
               apply. -->
          <textarea
            id="promptBox"
            class="prompt-input"
            rows="1"
            placeholder="Queue another message..."
            style="font-family: var(--vscode-editor-font-family, Consolas, 'Cascadia Mono', 'Courier New', monospace) !important; font-weight: 400; line-height: 1.34;"
          ></textarea>
          <button id="sendBtn" class="send-button" type="button" data-tooltip="Send message" data-i18n-tip="tooltip.send" aria-label="Send message"></button>
        </div>

        <div id="attachments" class="attachments" aria-label="Queued file attachments"></div>

        <div class="prompt-toolbar">
        <div class="toolbar-tools">
          <button id="addBtn" class="tool-button" type="button" data-tooltip="New conversation" data-i18n-tip="tooltip.new_conversation" aria-label="New conversation">
            <img src="{{ASSETS_BASE}}/add.svg" alt="" />
          </button>
          <button id="storedPromptsBtn" class="tool-button" type="button" data-tooltip="Stored prompts" data-i18n-tip="tooltip.stored_prompts" aria-label="Stored prompts">
            <img src="{{ASSETS_BASE}}/stored_prompts.svg" alt="" />
          </button>
          <button id="chatHistoryBtn" class="tool-button" type="button" data-tooltip="Chat history" data-i18n-tip="tooltip.chat_history" aria-label="Chat history">
            <img src="{{ASSETS_BASE}}/chat_history.svg" alt="" />
          </button>
          <button id="attachFileBtn" class="tool-button" type="button" data-tooltip="Attach file" data-i18n-tip="tooltip.attach" aria-label="Attach file">
            <img src="{{ASSETS_BASE}}/attach_file.svg" alt="" />
          </button>
          <button id="ttsBtn" class="tool-button" type="button" data-tooltip="Read aloud · right-click = auto-read every reply" data-i18n-tip="tooltip.tts" aria-label="Text to speech">
            <img src="{{ASSETS_BASE}}/tts.svg" alt="" />
            <!-- Spinner overlay: hidden until ttsBtn.classList contains
                 `autoread`. Then it animates over the tts icon to signal
                 that every incoming assistant message is being read. -->
            <img class="cbe-autoread-ring" src="{{ASSETS_BASE}}/auto_read_spinner.svg" alt="" aria-hidden="true" />
          </button>
          <button id="sttBtn" class="tool-button" type="button" data-tooltip="Speech to text" data-i18n-tip="tooltip.stt" aria-label="Speech to text">
            <img src="{{ASSETS_BASE}}/stt.svg" alt="" />
            <!-- Blue spinner overlay shown while #sttBtn.is-recording. Same
                 pattern as #monitorBtn so the user gets clear feedback that
                 the host-side SAPI mic is actively listening. -->
            <img class="cbe-spinner" src="{{ASSETS_BASE}}/loading_orange.svg" alt="" />
          </button>
          <button id="autoReplyBtn" class="tool-button" type="button" data-tooltip="Auto Prompt" data-i18n-tip="tooltip.autoprompt" aria-label="Auto Prompt">
            <img src="{{ASSETS_BASE}}/auto_reply.svg" alt="" />
            <!-- Reuse the same SVG + halo treatment the TTS auto-read uses
                 so a running Auto Prompt visually matches Auto Read instead
                 of the simple monitor-style blue arc. The countdown badge
                 sits over the corner in the active skin's highlight color. -->
            <img class="cbe-spinner" src="{{ASSETS_BASE}}/auto_read_spinner.svg" alt="" aria-hidden="true" />
            <span class="cbe-countdown" aria-hidden="true">0</span>
          </button>
          <button id="wakeUpBtn" class="tool-button" type="button" data-tooltip="Wake-up response" data-i18n-tip="tooltip.wake" aria-label="Wake-up response">
            <img src="{{ASSETS_BASE}}/wake_up.svg" alt="" />
          </button>
          <button id="showCommandsBtn" class="tool-button" type="button" data-tooltip="Show command menu" data-i18n-tip="tooltip.command_menu" aria-label="Show command menu">
            <img src="{{ASSETS_BASE}}/show_command_menu.svg" alt="" />
          </button>
          <button id="compactBtn" class="tool-button" type="button" data-tooltip="Compact conversation" data-i18n-tip="tooltip.compact" aria-label="Compact">
            <img src="{{ASSETS_BASE}}/compact.svg" alt="" />
            <span class="cbe-ctx-ring" aria-hidden="true"></span>
          </button>
          <button id="handbookBtn" class="tool-button" type="button" data-tooltip="Handbook" data-i18n-tip="tooltip.handbook" aria-label="Handbook">
            <img src="{{ASSETS_BASE}}/handbook.svg" alt="" />
          </button>
          <button id="settingsBtn" class="tool-button" type="button" data-tooltip="Settings" data-i18n-tip="tooltip.settings" aria-label="Settings">
            <img src="{{ASSETS_BASE}}/settings.svg" alt="" />
          </button>
          <!-- Accounts manager — per-provider API-key rotation. Uses a real
               accounts.svg asset (currentColor person-silhouette) so it picks
               up every skin's `.tool-button img` icon filter exactly like the
               other buttons. The previous inline data-URI <img> rendered blank
               in the webview (raw <> in a `;utf8,` data URI is rejected) — that
               left the Accounts button invisible (user 2026-05-22: "Accounts
               and Browser buttons are missing"). Opens #accountsModal; the
               multi-account plumbing lives in extension.js ([accounts]). -->
          <button id="accountsBtn" class="tool-button" type="button" data-tooltip="Accounts — manage API keys" data-i18n-tip="tooltip.accounts" aria-label="Accounts">
            <img src="{{ASSETS_BASE}}/accounts.svg" alt="" />
          </button>
          <button id="extensionsBtn" class="tool-button" type="button" data-tooltip="Extensions" data-i18n-tip="tooltip.extensions" aria-label="Extensions">
            <img src="{{ASSETS_BASE}}/extensions.svg" alt="" />
          </button>
          <button id="projectFolderBtn" class="tool-button" type="button" data-tooltip="Project folder" data-i18n-tip="tooltip.project_folder" aria-label="Project folder">
            <img src="{{ASSETS_BASE}}/project_folder.svg" alt="" />
          </button>
          <!-- Browser — uses the lightweight currentColor browser.svg (the old
               browser.png was a 122 KB raster that rendered blank, leaving the
               Browser button invisible — user 2026-05-22). SVG matches every
               other toolbar icon and recolors under each skin's icon filter. -->
          <button id="browserBtn" class="tool-button" type="button" data-tooltip="Browser" data-i18n-tip="tooltip.browser" aria-label="Browser">
            <img src="{{ASSETS_BASE}}/browser.svg" alt="" />
          </button>
          <button id="monitorBtn" class="tool-button" type="button" data-tooltip="VSCode monitor" data-i18n-tip="tooltip.monitor" aria-label="VSCode monitor">
            <img src="{{ASSETS_BASE}}/vscode_monitor.svg" alt="" />
            <img class="cbe-spinner" src="{{ASSETS_BASE}}/loading_orange.svg" alt="" />
          </button>
          <button id="terminalBtn" class="tool-button" type="button" data-tooltip="Terminal" data-i18n-tip="tooltip.terminal" aria-label="Terminal">
            <img src="{{ASSETS_BASE}}/terminal.svg" alt="" />
          </button>
          <button id="setupBtn" class="tool-button" type="button" data-tooltip="Setup wizard — configure API keys" data-i18n-tip="tooltip.setup" aria-label="Setup">
            <img src="{{ASSETS_BASE}}/setup.svg" alt="" />
          </button>
          <button id="gitBtn" class="tool-button" type="button" data-tooltip="Git" data-i18n-tip="tooltip.git" aria-label="Git">
            <img src="{{ASSETS_BASE}}/git.svg" alt="" />
          </button>
          <button id="githubBtn" class="tool-button" type="button" data-tooltip="GitHub" data-i18n-tip="tooltip.github" aria-label="GitHub">
            <img src="{{ASSETS_BASE}}/github.svg" alt="" />
          </button>
          <button id="domainsBtn" class="tool-button" type="button" data-tooltip="NameSilo domains" data-i18n-tip="tooltip.domains" aria-label="Domains">
            <img src="{{ASSETS_BASE}}/domain.svg" alt="" />
          </button>
          <button id="fontSizeBtn" class="tool-button" type="button" data-tooltip="Font size (toggle big)" data-i18n-tip="tooltip.font_size" aria-label="Font size">
            <img src="{{ASSETS_BASE}}/font_size.svg" alt="" />
          </button>
          <button id="helpBtn" class="tool-button" type="button" data-tooltip="Help" data-i18n-tip="tooltip.help" aria-label="Help">
            <img src="{{ASSETS_BASE}}/help.svg" alt="" />
          </button>
          <!-- Tamagotchi launcher — opens the dot-matrix pet game (panel/dotmatrix-tamagotchi-*.js).
               Uses an <img> of tamagotchi.svg (currentColor, like settings.svg) so the
               per-skin `.tool-button img` icon filter recolors it identically to every
               other icon. It was previously an inline <svg>, which no skin filter could
               reach — so it stayed black/invisible on dark skins (user 2026-05-22: "the
               Tamagotchi icon is hard to see black on dark grey, needs to be light grey
               like the other three"). The game shell still mounts below as #cbe-tama-shell. -->
          <button id="tamaBtn" class="tool-button" type="button" data-tooltip="Tamagotchi pet" data-i18n-tip="tooltip.tamagotchi" aria-label="Tamagotchi pet">
            <img src="{{ASSETS_BASE}}/tamagotchi.svg" alt="" />
          </button>
          <!-- Pinned extensions render here — one quick-launch button per
               extension the user pinned via the Extensions marketplace.
               Populated by renderPinnedExtensionButtons() in panel.js from
               config.ini's [extensions] pinned list. -->
          <span id="cbe-pinned-ext-row" class="cbe-pinned-ext-row" style="display:inline-flex;align-items:center;gap:4px;"></span>
        </div>

        <div class="toolbar-meta">
          <button id="label-pill" class="label-button" type="button" data-tooltip="Open settings" data-i18n-tip="tooltip.settings" aria-label="Current assistant profile">
            <img id="brandLabelImg" src="{{ASSETS_BASE}}/labels/en.svg" data-cbe-brand alt="Claude Codex — Black Edition" />
          </button>

          <div id="project-path" class="project-path" data-tooltip="No project folder — click the folder button to pick one" data-i18n-tip="label.no_project" aria-label="Active project folder" title=""></div>

          <button id="stopBtn" class="stop-button" type="button" data-tooltip="Stop generation" data-i18n-tip="tooltip.stop" aria-label="Stop generation">
            <span class="stop-button__icon" aria-hidden="true"></span>
            <span class="stop-button__label">Stop</span>
          </button>
        </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Tooltip overlay used by data-tooltip elements -->
  <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

  <!-- ── ACCOUNTS MODAL (standalone — toolbar #accountsBtn) ───────────────
       Easy-access UI over the multi-account plumbing in extension.js. Lets
       the user pick a provider, see each masked key + label, Edit / Delete a
       row, and Add a new account. Hidden by default; panel.js toggles .show.
       Rows + add-form are populated by renderAccountsList() on the host's
       accountsState reply. Keys are NEVER rendered raw — only masked. ─────── -->
  <div id="accountsModal" role="dialog" aria-modal="true" aria-label="Accounts">
    <div class="cbe-box">
      <div class="cbe-hdr">
        <span>Accounts — manage API keys</span>
        <button type="button" class="cbe-x-svg" id="cbe-am-close" aria-label="Close"></button>
      </div>
      <div class="cbe-body">
        <div>
          <label for="accountsProvider">Provider</label>
          <select id="accountsProvider"></select>
        </div>
        <div>
          <label>Accounts <span id="cbe-am-count" style="opacity:.6;font-weight:400;text-transform:none;letter-spacing:0;"></span></label>
          <div id="cbe-am-list"></div>
        </div>
        <div class="cbe-am-addform">
          <label style="margin-bottom:2px;">Add account</label>
          <input type="text" id="cbe-am-label" placeholder="Label (e.g. work, alt-2)" autocomplete="off" spellcheck="false" />
          <input type="password" id="cbe-am-key" placeholder="API key" autocomplete="off" spellcheck="false" />
          <div id="cbe-am-err"></div>
          <div style="display:flex;justify-content:flex-end;">
            <button type="button" class="cbe-btn cbe-save" id="cbe-am-add">Add</button>
          </div>
        </div>
      </div>
      <div class="cbe-foot">
        <button type="button" class="cbe-btn cbe-cancel" id="cbe-am-done">Close</button>
      </div>
    </div>
  </div>

  <!-- ── TAMAGOTCHI GAME SHELL ─────────────────────────────────────────────
       Hidden by default. Opens as a floating modal overlay when #tamaBtn
       is pressed (or when window.openTamagotchi() is called via slash
       commands / future hot-keys). Layout is skin-independent: skins
       can re-position via CSS using the data-skin="tamagotchi" hook on
       <body> if they want it docked. ─────────────────────────────────── -->
  <div id="cbe-tama-shell" hidden role="dialog" aria-label="Tamagotchi pet" aria-modal="false">
    <div class="cbe-tama-frame">
      <div class="cbe-tama-titlebar">
        <span class="cbe-tama-title">Tamagotchi</span>
        <button id="cbe-tama-close" type="button" aria-label="Close Tamagotchi" title="Close">×</button>
      </div>
      <div id="cbe-tama-status" role="status" aria-live="polite">
        <span class="tama-stat" data-stat="stage"       data-tooltip="Lifecycle stage"   title="Lifecycle stage">🥚 egg</span>
        <span class="tama-stat" data-stat="hunger"      data-tooltip="Hunger"            title="Hunger">🍖 100</span>
        <span class="tama-stat" data-stat="happiness"   data-tooltip="Happiness"         title="Happiness">😀 100</span>
        <span class="tama-stat" data-stat="health"      data-tooltip="Health"            title="Health">❤️ 100</span>
        <span class="tama-stat" data-stat="cleanliness" data-tooltip="Cleanliness"       title="Cleanliness">✨ 100</span>
        <span class="tama-stat" data-stat="age"         data-tooltip="Age in minutes"    title="Age (minutes)">⏱ 0</span>
      </div>
      <div class="cbe-tama-lcd">
        <canvas id="cbe-tama-screen" width="240" height="240"></canvas>
        <!-- Thin in-screen control strip — small pixel-icon buttons that sit
             inside the LCD frame, matching the reference gif's icon row.
             Each button keeps its data-action so the existing delegated
             click handler dispatches to the game loop unchanged. The pixel
             glyph is drawn into the <canvas> child by drawTamaIcons() from
             TAMAGOTCHI_SPRITES via DotMatrix40.spriteFromAscii. -->
        <div id="cbe-tama-buttons">
          <button class="tama-btn" data-action="feed"   data-icon="iconFeed"   type="button" title="Feed (cycle meat / eggplant)" aria-label="Feed"><canvas width="24" height="24" aria-hidden="true"></canvas></button>
          <button class="tama-btn" data-action="clean"  data-icon="iconClean"  type="button" title="Clean poop" aria-label="Clean"><canvas width="24" height="24" aria-hidden="true"></canvas></button>
          <button class="tama-btn" data-action="play"   data-icon="iconPlay"   type="button" title="Play" aria-label="Play"><canvas width="24" height="24" aria-hidden="true"></canvas></button>
          <button class="tama-btn" data-action="shot"   data-icon="iconShot"   type="button" title="Give shot (heals when sick)" aria-label="Shot"><canvas width="24" height="24" aria-hidden="true"></canvas></button>
          <button class="tama-btn" data-action="light"  data-icon="iconLight"  type="button" title="Toggle light (sleep)" aria-label="Light"><canvas width="24" height="24" aria-hidden="true"></canvas></button>
          <button class="tama-btn" data-action="select" data-icon="iconSelect" type="button" title="Select / confirm" aria-label="Select"><canvas width="24" height="24" aria-hidden="true"></canvas></button>
        </div>
      </div>
      <div id="cbe-tama-banner" hidden></div>
      <div id="cbe-tama-hint" class="cbe-tama-hint">Tip: Feed cycles meat ↔ eggplant. Press Select to feed.</div>
    </div>
  </div>

  <!-- Minimal skin-independent CSS for the Tamagotchi modal. The
       skins/tamagotchi/styles.css file is owned by another agent and may
       override / reposition any of this; these styles are just the
       baseline so the game is visible + clickable in ANY skin. -->
  <style id="cbe-tama-baseline-css">
    #cbe-tama-shell {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 280px;
      z-index: 9000;
      font-family: var(--cbe-monospace, Consolas, monospace);
      color: #d8d8d8;
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
      border-radius: 14px;
      user-select: none;
    }
    #cbe-tama-shell[hidden] { display: none !important; }
    #cbe-tama-shell .cbe-tama-frame {
      background: linear-gradient(180deg, #2c3a1e, #1a2410);
      border: 2px solid #6f8a3a;
      border-radius: 14px;
      padding: 10px 12px 12px 12px;
    }
    #cbe-tama-shell .cbe-tama-titlebar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    #cbe-tama-shell .cbe-tama-title {
      font-weight: 600; font-size: 13px; letter-spacing: 0.04em;
      color: #d8e8b8;
    }
    #cbe-tama-shell #cbe-tama-close {
      background: transparent; border: 0; color: #d8e8b8;
      font-size: 20px; line-height: 1; cursor: pointer; padding: 0 4px;
    }
    #cbe-tama-shell #cbe-tama-close:hover { color: #fff; }
    #cbe-tama-shell #cbe-tama-status {
      display: flex; flex-wrap: wrap; gap: 4px 8px;
      font-size: 11px; margin-bottom: 8px;
      background: rgba(0,0,0,0.25);
      padding: 4px 6px; border-radius: 6px;
    }
    #cbe-tama-shell .tama-stat { white-space: nowrap; }
    /* The LCD module — a single flat green panel that holds the pixel
       screen AND the in-screen icon strip, matching the reference gif
       (no gradient — one uniform LCD-green fill). */
    #cbe-tama-shell .cbe-tama-lcd {
      background: #8db83f;
      border: 3px inset #4a5a2a;
      border-radius: 6px;
      padding: 6px 6px 4px 6px;
      margin: 0 auto 8px auto;
      width: 240px;
    }
    #cbe-tama-shell #cbe-tama-screen {
      display: block;
      margin: 0 auto;
      width: 226px; height: 200px;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      border: 0;
      background: #8db83f;
    }
    #cbe-tama-shell #cbe-tama-banner {
      text-align: center; font-size: 12px; padding: 6px 4px;
      background: rgba(180, 60, 60, 0.25);
      border: 1px solid #a44; border-radius: 6px;
      margin-bottom: 6px; color: #fdd;
    }
    #cbe-tama-shell #cbe-tama-banner button {
      margin-left: 8px; padding: 2px 8px;
      background: #6f8a3a; color: #fff; border: 0;
      border-radius: 4px; cursor: pointer; font-size: 11px;
    }
    /* In-screen icon strip — a thin horizontal row of small pixel-icon
       buttons sitting inside the LCD frame, exactly like the reference
       gif's bottom icon row. No big text buttons; each button is just a
       ~22px clickable square that draws a dark pixel glyph onto the
       flat green LCD. data-action still drives the game loop. */
    #cbe-tama-shell #cbe-tama-buttons {
      display: flex;
      justify-content: space-between;
      gap: 2px;
      margin-top: 4px;
      padding-top: 3px;
      border-top: 1px solid rgba(40,58,30,0.35);
    }
    #cbe-tama-shell .tama-btn {
      background: transparent;
      border: 0;
      border-radius: 3px;
      padding: 1px;
      width: 22px; height: 22px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
    }
    #cbe-tama-shell .tama-btn canvas {
      width: 18px; height: 18px;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      display: block;
    }
    #cbe-tama-shell .tama-btn:hover { background: rgba(40,58,30,0.18); }
    #cbe-tama-shell .tama-btn:active { background: rgba(40,58,30,0.34); }
    #cbe-tama-shell .tama-btn:focus-visible { outline: 1px solid #2c3a1e; }
    #cbe-tama-shell .cbe-tama-hint {
      margin-top: 6px; font-size: 10px; color: #99a883; text-align: center;
      opacity: 0.85;
    }

  /* === DOCK ICON SWAP (Mac+Mint glass redesign) === */
  /* Strip per-icon button chrome in both dock skins */
  .skin-macos-color-dock .tool-button,
  .skin-mint-dock .tool-button {
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    padding: 4px !important;
    border-radius: 0 !important;
  }
  .skin-macos-color-dock .tool-button:hover,
  .skin-mint-dock .tool-button:hover {
    transform: translateY(-3px) scale(1.18) !important;
    transition: transform 150ms ease !important;
    background: transparent !important;
  }
  .skin-macos-color-dock .tool-button img,
  .skin-mint-dock .tool-button img {
    width: 44px !important;
    height: 44px !important;
    filter: none !important;
  }

  /* Alpha-glass dock body — macOS color variant (light frosted) */
  .skin-macos-color-dock .toolbar-tools {
    background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.20) 0%,
        rgba(255, 255, 255, 0.08) 100%) !important;
    backdrop-filter: blur(20px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
    border-radius: 12px !important;
    border: 1px solid rgba(255, 255, 255, 0.30) !important;
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),

    background: linear-gradient(180deg,
        rgba(30, 30, 30, 0.65) 0%,
        rgba(10, 10, 10, 0.80) 100%) !important;

    border-radius: 12px !important;
    border-top: 1px solid rgba(255, 255, 255, 0.25) !important;
    border-left: 1px solid rgba(255, 255, 255, 0.10) !important;
    border-right: 1px solid rgba(255, 255, 255, 0.10) !important;
    border-bottom: 1px solid rgba(0, 0, 0, 0.40) !important;
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.20),
        0 6px 20px rgba(0, 0, 0, 0.50) !important;
    padding: 8px 14px !important;
    flex-wrap: wrap !important;
    overflow: visible !important;
    margin: 8px auto !important;
    width: max-content !important;
    max-width: calc(100% - 32px) !important;
    gap: 6px !important;
  }

  /* macOS skin — per-button icon swap (24 rules). Spinner-bearing
     buttons (tts/stt/autoReply/monitor/compact) target :first-of-type
     so the spinner overlay is left alone. */
  .skin-macos-color-dock #addBtn > img {
    content: url("assets/dock_icons/macos/add.svg") !important;

<!-- Tamagotchi: dot-matrix engine + sprites + game logic + UI wiring.

     window.TamagotchiGame are defined when panel.js runs (panel.js itself
     does not reference them yet, but future integrations can). All three
     files self-guard against double-registration. -->

<!-- Tamagotchi UI wiring — instantiates the game on first launch,
     binds the toolbar button + 6 action buttons + persistence, manages
     the death/respawn banner. Self-contained so it doesn't bloat panel.js. -->
<script>
(function () {
  "use strict";

  const STORAGE_KEY = "cbe-tamagotchi-v1";
  let game = null;
  let lastRenderedStats = null;

  function el(id) { return document.getElementById(id); }

  function refreshStats(g) {
    /* Render the stat row + (re)draw the death banner. Called every tick. */
    if (!g) return;
    const fmt = (n) => Math.round(Math.max(0, Math.min(100, n)));
    const row = el("cbe-tama-status");
    if (row) {
      /* Stage glyph map — small emoji cue per lifecycle phase. Dead is
         handled via the banner; this row keeps showing the last live stage. */
      const STAGE_GLYPHS = {
        egg: "🥚 egg", baby: "🐣 baby", child: "🐥 child",
        teen: "🐤 teen", adult: "🐔 adult", senior: "👴 senior",
        dead: "💀 dead"
      };
      row.querySelectorAll(".tama-stat").forEach((node) => {
        const stat = node.getAttribute("data-stat");
        let v;
        switch (stat) {
          case "stage":       v = STAGE_GLYPHS[g.stage] || ("· " + g.stage); break;
          case "hunger":      v = "🍖 " + fmt(g.hunger); break;
          case "happiness":   v = "😀 " + fmt(g.happiness); break;
          case "health":      v = "❤️ " + fmt(g.health); break;
          case "cleanliness": v = "✨ " + fmt(g.cleanliness); break;
          case "age":         v = "⏱ " + (g.age | 0); break;
          default: return;
        }
        if (node.textContent !== v) node.textContent = v;
      });
    }
    /* Death banner appears with a "Hatch new" button. */
    const banner = el("cbe-tama-banner");
    if (banner) {
      if (!g.isAlive) {
        if (banner.hidden) {
          banner.hidden = false;
          banner.innerHTML = "💀 Your pet died. <button type='button' id='cbe-tama-respawn'>Hatch new</button>";
          const btn = el("cbe-tama-respawn");
          if (btn) btn.addEventListener("click", () => { g.reset(); banner.hidden = true; });
        }
      } else if (!banner.hidden) {
        banner.hidden = true;
      }
    }
    /* Hint line updates to reflect feed-menu state. */
    const hint = el("cbe-tama-hint");
    if (hint) {
      const target = g.feedMenuOpen
        ? ("Feed: " + (g.feedMenuChoice === "meat" ? "🥩 Meat" : "🍆 Eggplant") + " — press Select")
        : "Tip: Feed cycles meat ↔ eggplant. Press Select to feed.";
      if (hint.textContent !== target) hint.textContent = target;
    }
  }

  function ensureGame() {
    if (game) return game;
    if (!window.DotMatrix40 || !window.TamagotchiGame || !window.TAMAGOTCHI_SPRITES) {
      console.warn("[Tamagotchi] dependencies missing — DotMatrix40/TamagotchiGame/SPRITES not loaded");
      return null;
    }
    const canvas = el("cbe-tama-screen");
    if (!canvas) return null;
    /* Flat single-tone LCD: OFF cells share the exact background colour so
       the screen reads as one uniform light-green panel (matching the
       reference gif) instead of a two-tone / gradient grid. ON cells are
       a thin dark-green pixel for the creature outline. */
    const matrix = new window.DotMatrix40(canvas, {
      cellSize: 6, gap: 0, cellShape: "rect",
      onColor: "#26331a",
      offColor: "#8db83f",
      bgColor: "#8db83f",
    });

    /* Restore from localStorage if a save exists; otherwise start fresh. */
    const saved = window.TamagotchiGame.loadState(STORAGE_KEY) || {};
    const opts = Object.assign({}, saved, {
      storageKey: STORAGE_KEY,
      onStatsChange: refreshStats,
    });
    game = new window.TamagotchiGame(matrix, window.TAMAGOTCHI_SPRITES, opts);
    window.__cbeTamagotchi = game;  /* expose for debug + slash commands */
    return game;
  }

  /* Draw the small dark-pixel glyph for each control button onto its
     child <canvas>, sourced from TAMAGOTCHI_SPRITES via the DotMatrix40
     ASCII parser. Runs once — the glyphs are static. Re-callable safely
     (idempotent). Mirrors the reference gif's thin in-screen icon row. */
  let iconsDrawn = false;
  function drawTamaIcons() {
    if (iconsDrawn) return;
    const sprites = window.TAMAGOTCHI_SPRITES;
    const parse = window.DotMatrix40 && window.DotMatrix40.spriteFromAscii;
    if (!sprites || typeof parse !== "function") return;
    const buttons = document.querySelectorAll("#cbe-tama-buttons .tama-btn[data-icon]");
    if (!buttons.length) return;
    buttons.forEach((btn) => {
      const ascii = sprites[btn.getAttribute("data-icon")];
      const cv = btn.querySelector("canvas");
      if (!ascii || !cv) return;
      const glyph = parse(ascii);
      const ctx = cv.getContext("2d");
      if (!ctx || !glyph || !glyph.w || !glyph.h) return;
      /* Fit the glyph cells into the canvas with a 1px margin. */
      const cell = Math.max(1, Math.floor(Math.min(
        (cv.width - 2) / glyph.w,
        (cv.height - 2) / glyph.h
      )));
      const ox = Math.floor((cv.width - glyph.w * cell) / 2);
      const oy = Math.floor((cv.height - glyph.h * cell) / 2);
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = "#26331a";
      for (let y = 0; y < glyph.h; y++) {
        for (let x = 0; x < glyph.w; x++) {
          if (glyph.data[y * glyph.w + x]) {
            ctx.fillRect(ox + x * cell, oy + y * cell, cell, cell);
          }
        }
      }
    });
    iconsDrawn = true;
  }

  function openShell() {
    const shell = el("cbe-tama-shell");
    if (!shell) return;
    const g = ensureGame();
    if (!g) return;
    shell.hidden = false;
    drawTamaIcons();
    g.start();
    refreshStats(g);
  }

  function closeShell() {
    const shell = el("cbe-tama-shell");
    if (shell) shell.hidden = true;
    if (game) game.stop();
  }

  function toggleShell() {
    const shell = el("cbe-tama-shell");
    if (!shell) return;
    if (shell.hidden) openShell(); else closeShell();
  }

  /* Wire the toolbar button + close button + 6 action buttons + Escape.
     Toolbar button uses a DELEGATED body listener (not addEventListener
     directly on #tamaBtn) so it survives toolbar rebuilds / panel-init
     order races — wire() runs once; the delegated handler keeps working
     even if the button is later replaced. The SVG icon inside the button
     captures the click but closest("#tamaBtn") walks up to find it. */
  function wire() {
    document.body.addEventListener("click", (ev) => {
      const t = ev.target;
      if (!t || !t.closest) return;
      if (t.closest("#tamaBtn")) {
        console.log("[Tamagotchi] tamaBtn clicked → toggleShell()");
        toggleShell();
      }
    });
    if (!el("tamaBtn")) {
      console.warn("[Tamagotchi] wire(): #tamaBtn not in DOM at wire time (delegated listener still active)");
    }

    const closeBtn = el("cbe-tama-close");
    if (closeBtn) closeBtn.addEventListener("click", closeShell);

    const shell = el("cbe-tama-shell");
    if (shell) {
      shell.addEventListener("click", (ev) => {
        const btn = ev.target.closest(".tama-btn[data-action]");
        if (!btn) return;
        const g = ensureGame();
        if (!g) return;
        const action = btn.getAttribute("data-action");
        /* Map button data-action → method on the game instance. */
        const fn = g[action];
        if (typeof fn === "function") {
          try { fn.call(g); } catch (e) { console.warn("[Tamagotchi] action error:", e); }
          refreshStats(g);
        }
      });
    }

    /* Click the tombstone (the dot-matrix screen while dead) → hatch a
       new egg. Living pets ignore canvas clicks — actions go through
       the labeled buttons below. */
    const screen = el("cbe-tama-screen");
    if (screen) {
      screen.style.cursor = "pointer";
      screen.addEventListener("click", () => {
        const g = ensureGame();
        if (!g || g.isAlive) return;
        try { g.reset(); } catch (e) { console.warn("[Tamagotchi] respawn error:", e); }
        refreshStats(g);
      });
    }

    document.addEventListener("keydown", (ev) => {
      const shell = el("cbe-tama-shell");
      if (!shell || shell.hidden) return;
      if (ev.key === "Escape") { closeShell(); ev.preventDefault(); }
    });
  }

  /* Public openers — slash-command handlers / future integrations can call
     these without touching the DOM directly. */
  window.openTamagotchi  = openShell;
  window.closeTamagotchi = closeShell;
  window.toggleTamagotchi = toggleShell;

  /* Auto-open / auto-close the pet shell when the tamagotchi skin is
     applied/removed. Watches <body data-skin> via MutationObserver so
     it reacts to both the boot-time skin apply (set by panel.js init)
     and runtime swaps via Settings → Skin dropdown.

     The skin's CSS pins #cbe-tama-shell display:block regardless of the
     [hidden] attribute, but the game's tick loop is gated by start()/
     stop() — so we still need this hook to keep the simulation running. */
  function syncSkinAutoOpen() {
    const isTama = document.body && document.body.getAttribute("data-skin") === "tamagotchi";
    if (isTama) {
      openShell();
    } else if (game) {
      /* Don't HIDE the shell on skin removal (user may have opened it via
         the toolbar button on a different skin); just leave whatever
         visibility state was there. The game loop keeps running. */
    }
  }
  function watchSkinChanges() {
    try {
      const obs = new MutationObserver(syncSkinAutoOpen);
      obs.observe(document.body, { attributes: true, attributeFilter: ["data-skin"] });
      syncSkinAutoOpen();
    } catch (e) {
      console.warn("[Tamagotchi] skin observer failed:", e && e.message);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => { wire(); watchSkinChanges(); }, { once: true });
  } else {
    wire();
    watchSkinChanges();
  }
})();
</script>
