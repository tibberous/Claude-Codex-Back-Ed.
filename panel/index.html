<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Claude Codex Black</title>
<link rel="stylesheet" href="{{PRISM_CSS_URI}}" />
<style>
  /* ── Panel shell + chat thread (GPT's prompt-bar design, hooked into the
     extension's JS via #textInput / #sendBtn / #addBtn / #sttBtn / #ttsBtn /
     #label-pill / #savedPromptsBtn / #autoReplyBtn) ──────────────────── */
:root {
  --shell-radius: 28px;
  --input-radius: 20px;
  --button-radius: 15px;
  --orange-1: #ffcc00;
  --orange-2: #ff8b00;
  --orange-3: #ff5b00;
  --orange-4: #dc3000;
  --orange-5: #9f1600;
  --ink: #111111;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  color: #fff;
  font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background:
    linear-gradient(135deg, rgba(255,255,255,.02) 25%, transparent 25%) 0 0/28px 28px,
    linear-gradient(225deg, rgba(255,255,255,.02) 25%, transparent 25%) 0 0/28px 28px,
    linear-gradient(315deg, rgba(255,255,255,.02) 25%, transparent 25%) 0 0/28px 28px,
    linear-gradient(45deg, rgba(255,255,255,.02) 25%, transparent 25%) 0 0/28px 28px,
    linear-gradient(180deg, #2f2420 0%, #1a1110 100%);
}

.demo-stage {
  height: 100vh;
  padding: 18px;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.prompt-shell {
  width: 100%;
  max-width: 1935px;
  margin: 0 auto;
  position: relative;
  padding: 14px 26px 22px;
  border-radius: var(--shell-radius);
  border: 2px solid rgba(255, 192, 40, 0.95);
  background:
    linear-gradient(180deg, rgba(255, 224, 75, 0.9) 0%, rgba(255, 186, 0, 0.82) 2.5%, rgba(255, 138, 0, 0.88) 6%, rgba(255, 92, 0, 0.94) 32%, rgba(226, 51, 0, 0.97) 68%, rgba(167, 24, 0, 1) 100%);
  box-shadow:
    0 0 0 3px rgba(255, 94, 0, 0.95),
    0 0 16px rgba(255, 160, 0, 0.95),
    0 0 34px rgba(255, 86, 0, 0.82),
    0 22px 40px rgba(0, 0, 0, 0.62);
}

.prompt-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow:
    inset 0 2px 0 rgba(255, 240, 170, 0.75),
    inset 0 -2px 0 rgba(120, 0, 0, 0.3);
}

.prompt-input-wrap {
  position: relative;
  margin-bottom: 17px;
  border-radius: var(--input-radius);
  border: 2px solid rgba(52, 52, 52, 0.95);
  background: linear-gradient(180deg, #f7f7f7 0%, #f1f1f1 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 1px 0 rgba(0, 0, 0, 0.25),
    0 3px 10px rgba(0, 0, 0, 0.12);
  padding: 14px 76px 14px 23px;
}

.prompt-input {
  width: 100%;
  min-height: 46px;
  max-height: 240px;
  resize: none;
  overflow: hidden;
  border: 0;
  outline: 0;
  background: transparent;
  color: #3c3c3c;
  font: 400 25px/1.34 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
.prompt-input::placeholder { color: #434343; opacity: 1; }

.send-button {
  position: absolute;
  top: 50%;
  right: 19px;
  width: 51px;
  height: 54px;
  margin: 0;
  transform: translateY(-50%);
  border: 0;
  background: transparent url('{{ASSETS_BASE}}/send.png') center/contain no-repeat;
  cursor: pointer;
}
.send-button:hover,
.send-button.is-hover { background-image: url('{{ASSETS_BASE}}/send_over.png'); }
.send-button:active,
.send-button.is-active { background-image: url('{{ASSETS_BASE}}/send_click.png'); }

.prompt-toolbar {
  display: flex;
  align-items: center;
  gap: 24px;
  min-height: 74px;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 26px;
}

.toolbar-group-left { gap: 28px; }
.toolbar-group-middle { gap: 26px; }
.toolbar-spacer { flex: 1 1 auto; }

.tool-button,
.label-button,
.stop-button {
  appearance: none;
  border: 0;
  cursor: pointer;
  padding: 0;
  background: transparent;
}

.tool-button {
  width: 58px;
  height: 58px;
  border-radius: var(--button-radius);
  border: 2px solid rgba(255, 160, 30, 0.96);
  background:
    linear-gradient(180deg, rgba(255, 145, 0, 1) 0%, rgba(255, 112, 0, 0.98) 25%, rgba(242, 71, 0, 0.98) 100%);
  box-shadow:
    inset 0 2px 0 rgba(255, 209, 100, 0.75),
    inset 0 -3px 0 rgba(150, 27, 0, 0.38),
    0 0 0 1px rgba(130, 30, 0, 0.5),
    0 5px 10px rgba(0, 0, 0, 0.22),
    0 0 14px rgba(255, 94, 0, 0.38);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
}

.tool-button:hover {
  transform: translateY(-1px);
  box-shadow:
    inset 0 2px 0 rgba(255, 224, 125, 0.88),
    inset 0 -2px 0 rgba(170, 33, 0, 0.42),
    0 0 0 1px rgba(140, 20, 0, 0.65),
    0 8px 14px rgba(0, 0, 0, 0.28),
    0 0 18px rgba(255, 112, 0, 0.65);
}

.tool-button:active,
.tool-button.is-active {
  transform: translateY(1px);
  filter: brightness(.92);
}

.tool-button img {
  width: 28px;
  height: 28px;
  display: block;
  filter: brightness(0) invert(1);
}

.label-button {
  display: block;
  width: 526px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.33);
}
.label-button img {
  display: block;
  width: 526px;
  height: 74px;
}
.label-button:hover { filter: brightness(1.04); }

.stop-button {
  height: 70px;
  padding: 0 28px;
  border-radius: 17px;
  display: inline-flex;
  align-items: center;
  gap: 15px;
  color: #f3f3f3;
  font-size: 25px;
  font-weight: 600;
  letter-spacing: .01em;
  border: 1px solid rgba(255,255,255,0.12);
  background:
    linear-gradient(180deg, rgba(42, 42, 42, 0.92) 0%, rgba(18, 18, 18, 0.96) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.24),
    inset 0 -2px 0 rgba(0,0,0,0.45),
    0 6px 14px rgba(0,0,0,0.35);
}
.stop-button:hover { filter: brightness(1.08); }

.stop-button__icon {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  background: #f3f3f3;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.35), 0 0 8px rgba(255,255,255,0.1);
}

.tooltip {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transform: translate(-9999px, -9999px);
  padding: 9px 12px;
  border-radius: 10px;
  color: #f2f2f2;
  background: rgba(15, 15, 15, 0.95);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 10px 18px rgba(0,0,0,0.45);
  font-size: 13px;
  line-height: 1.2;
  transition: opacity .12s ease;
}
.tooltip.is-visible { opacity: 1; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 1480px) {
  .prompt-shell { width: calc(100vw - 30px); padding-inline: 18px; }
  .prompt-toolbar { gap: 14px; flex-wrap: wrap; }
  .toolbar-group { gap: 14px; }
  .label-button, .label-button img { width: 420px; height: auto; }
  .toolbar-spacer { display: none; }
}

@media (max-width: 960px) {
  .prompt-input { font-size: 20px; }
  .tool-button { width: 52px; height: 52px; }
  .tool-button img { width: 24px; height: 24px; }
  .stop-button { height: 60px; font-size: 22px; }
  .label-button, .label-button img { width: min(100%, 526px); }
}

  /* CBE extension hooks added to GPT's design */
  :root { --cb-font-scale: 1; }
  body.cb-big { --cb-font-scale: 1.8; }
  .prompt-input { font-size: calc(25px * var(--cb-font-scale)); }
  .stop-button { font-size: calc(25px * var(--cb-font-scale)); }

  /* Chat thread above the prompt shell — light card on the dark backdrop */
  #thread {
    flex: 1 1 0; min-height: 0; overflow-y: auto;
    width: 100%; max-width: 1935px;
    margin: 0 auto 14px auto;
    padding: 18px 22px;
    display: flex; flex-direction: column; gap: 10px;
    color: #1f1f1f;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 14px 36px rgba(0,0,0,0.45), 0 6px 14px rgba(0,0,0,0.30);
  }
  #thread::-webkit-scrollbar { width: 6px; }
  #thread::-webkit-scrollbar-thumb { background: #c8c8c8; border-radius: 3px; }
  .msg {
    padding: 8px 14px; border-radius: 10px;
    font-size: calc(14px * var(--cb-font-scale));
    line-height: 1.55; max-width: 92%;
    word-break: break-word; white-space: pre-wrap;
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
  }
  .msg.sent      { background: #f0f0f0; border: 1px solid #d8d8d8;
                   align-self: flex-end;   color: #1f1f1f; }
  .msg.assistant { background: #ffffff; border: 1px solid #e0e0e0;
                   align-self: flex-start; color: #1f1f1f;
                   box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .msg.info      { background: transparent; border: 0;
                   align-self: flex-start; color: #6c6c6c;
                   font-size: calc(12px * var(--cb-font-scale));
                   font-style: italic; padding: 4px 8px; }
  .msg.error     { background: #fde8e8; border: 1px solid #f5c0c0;
                   align-self: flex-start; color: #8a1f1f; }
  .msg.assistant.streaming::after { content: '▍'; opacity: .6; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 0%,50% { opacity: .6 } 51%,100% { opacity: 0 } }

  /* Layout: dark backdrop; .demo-stage is a column flex container with 18 px
     gutter so #thread fills the space above the prompt-shell. */
  html, body { width: 100%; height: 100%; overflow: hidden; }
  .prompt-shell { width: 100%; max-width: 1935px; margin: 0 auto; flex: 0 0 auto; }

  /* Hidden cluster: features good.png doesn't show but the extension JS still binds */
  #toolbar-hidden { display: none; }

  /* When the in-flight Claude response is busy, the input box border yellows */
  .prompt-input-wrap.busy { border-color: #d69e2e; }

  /* Stop -> Send dual-state: hide stop-button label when there's no in-flight job.
     For now leave both visible — the existing JS toggles disabled state on sendBtn. */
  /* ── Settings modal ──────────────────────────────────────── */
  #cbe-settings { position: fixed; inset: 0; z-index: 2147483645;
    background: rgba(0,0,0,.65); display: flex;
    align-items: center; justify-content: center; }
  #cbe-settings .cbe-box { background: #1a1a1a; border: 2px solid #e8621a;
    border-radius: 8px; width: 420px; max-width: 90vw;
    box-shadow: 0 8px 40px rgba(0,0,0,.6); overflow: hidden; }
  #cbe-settings .cbe-hdr {
    padding: 10px 14px; background: linear-gradient(90deg,#b83c00,#e8621a);
    color: #fff; font-family: system-ui, sans-serif; font-weight: 700;
    font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  #cbe-settings .cbe-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  #cbe-settings label { font-size: 11px; color: #aaa;
    font-family: system-ui, sans-serif; text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 5px; display: block; }
  #cbe-settings select { width: 100%; background: #0f0f0f; color: #e8e8e8;
    border: 1px solid #333; border-radius: 5px; padding: 8px 10px;
    font-family: 'Consolas','Courier New',monospace; font-size: 12px; outline: none; }
  #cbe-settings select:focus { border-color: #e8621a; }
  #cbe-settings select option { background: #1a1a1a; color: #e8e8e8; }
  #cbe-settings .cbe-warn { color: #ff9b9b; font-size: 11px; padding: 6px 8px;
    background: #2a1212; border: 1px solid #5a1f1f; border-radius: 4px;
    font-family: system-ui, sans-serif; display: none; }
  #cbe-settings .cbe-warn.show { display: block; }
  #cbe-settings .cbe-foot { padding: 12px 18px; background: #111;
    border-top: 1px solid #222; display: flex; justify-content: flex-end; gap: 8px; }
  #cbe-settings button.cbe-btn { font-family: system-ui, sans-serif;
    font-weight: 700; font-size: 12px; cursor: pointer; padding: 7px 14px;
    border-radius: 5px; border: none; }
  #cbe-settings button.cbe-cancel { background: #2a2a2a; color: #ddd; }
  #cbe-settings button.cbe-save   { background: #e8621a; color: #fff; }
  #cbe-settings button.cbe-save:hover { background: #ff7a1a; }

  /* ── Context menu (View Source + DevTools) ────────────────── */
  #cbe-ctx-menu {
    position: fixed; z-index: 2147483647;
    background: #1e1e1e; border: 1.5px solid #444;
    border-radius: 6px; box-shadow: 0 4px 20px rgba(0,0,0,.5);
    font-size: 13px; font-family: 'Consolas', 'Courier New', monospace;
    min-width: 200px; overflow: hidden; user-select: none;
    padding: 4px 0;
  }
  #cbe-ctx-menu .cbe-item {
    padding: 8px 14px; cursor: pointer; color: #ddd;
    display: flex; align-items: center; gap: 8px;
  }
  #cbe-ctx-menu .cbe-item.disabled {
    color: #555; cursor: default;
  }
  #cbe-ctx-menu .cbe-item:not(.disabled):hover {
    background: #2a2a2a; color: #fff;
  }

  /* ── View Source modal ─────────────────────────────────────── */
  #cbe-source-modal {
    position: fixed; inset: 0; z-index: 2147483646;
    background: rgba(0,0,0,.65);
    display: flex; align-items: center; justify-content: center;
  }
  #cbe-source-modal .cbe-box {
    background: #1e1e1e; border: 2px solid #e8621a;
    border-radius: 8px; width: 80vw; max-width: 900px;
    max-height: 80vh; display: flex; flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,.6); overflow: hidden;
  }
  #cbe-source-modal .cbe-hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; border-bottom: 2px solid #e8621a;
    background: linear-gradient(90deg, #b83c00, #e8621a);
    flex-shrink: 0;
  }
  #cbe-source-modal .cbe-title {
    font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700;
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  #cbe-source-modal .cbe-actions {
    display: flex; align-items: center; gap: 8px;
  }
  #cbe-source-modal .cbe-copy {
    background: #e8621a; border: none; color: #fff; cursor: pointer;
    font-size: 11px; padding: 4px 10px; border-radius: 4px;
    font-family: system-ui, sans-serif; font-weight: 700;
  }
  #cbe-source-modal .cbe-close {
    background: none; border: none; color: #fff; cursor: pointer;
    font-size: 14px; padding: 2px 6px;
    font-family: system-ui, sans-serif; opacity: 0.85;
  }
  #cbe-source-modal .cbe-close:hover { opacity: 1; }
  #cbe-source-modal .cbe-scroller {
    overflow: auto; flex: 1; background: #1e1e1e;
  }
  #cbe-source-modal pre {
    margin: 0; padding: 16px; background: #1e1e1e;
    font-size: 13px; line-height: 1.5;
    font-family: 'Consolas', 'Courier New', monospace;
    counter-reset: cbe-line;
  }
  #cbe-source-modal pre code { background: transparent; padding: 0; }
  /* Line numbers (manual; we don't load the line-numbers plugin) */
  #cbe-source-modal .cbe-numbered { display: table; width: 100%; }
  #cbe-source-modal .cbe-row { display: table-row; }
  #cbe-source-modal .cbe-ln {
    display: table-cell; user-select: none; text-align: right;
    padding-right: 14px; color: #666;
    border-right: 1px solid #333; min-width: 32px;
  }
  #cbe-source-modal .cbe-code {
    display: table-cell; padding-left: 14px;
    white-space: pre-wrap; word-break: break-word;
  }

  /* ── Code block rendering (Prism wrappers, orange CBE theme) ───────── */
  .msg.assistant .cv-code-wrap { border-radius: 6px; overflow: hidden;
    margin: .6em 0; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .msg.assistant .cv-code-bar { display: flex; align-items: center;
    justify-content: space-between; padding: 5px 12px;
    background: linear-gradient(90deg, #b83c00 0%, #d44e0a 50%, #e8621a 100%);
    border-bottom: 1px solid rgba(0,0,0,.25); }
  .msg.assistant .cv-code-lang { font-family: 'Consolas','Fira Code',monospace;
    font-size: 11px; color: #fff; letter-spacing: .06em;
    text-transform: uppercase; font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .msg.assistant .cv-copy-btn { display: inline-flex; align-items: center;
    gap: 4px; background: rgba(0,0,0,.20);
    border: 1px solid rgba(255,255,255,.30); border-radius: 4px;
    color: #ffe0d0; font-size: 11px; font-weight: 600; cursor: pointer;
    padding: 2px 8px; letter-spacing: .04em;
    transition: background .15s, color .15s; }
  .msg.assistant .cv-copy-btn:hover { background: rgba(0,0,0,.35); color: #fff; }
  .msg.assistant .cv-copy-btn.copied { color: #6ee7b7; border-color: #6ee7b7; }
  /* Reset Prism's brown bg/borders to dark VS Code style. */
  .msg.assistant pre[class*="language-"],
  .msg.assistant code[class*="language-"] {
    background: #1e1e1e !important; text-shadow: none !important;
    color: #d4d4d4 !important;
    font-family: 'Consolas','Fira Code',monospace !important; font-size: 12px; }
  .msg.assistant pre[class*="language-"] {
    margin: 0 !important; padding: 12px !important;
    border-radius: 0 0 6px 6px !important; overflow: auto !important;
    border: none !important; box-shadow: none !important;
    white-space: pre; }
  /* VS Code dark+ token colours */
  .msg.assistant .token.comment    { color: #6a9955 !important; }
  .msg.assistant .token.keyword    { color: #569cd6 !important; }
  .msg.assistant .token.string     { color: #ce9178 !important; }
  .msg.assistant .token.number     { color: #b5cea8 !important; }
  .msg.assistant .token.function   { color: #dcdcaa !important; }
  .msg.assistant .token.class-name { color: #4ec9b0 !important; }
  .msg.assistant .token.operator,
  .msg.assistant .token.punctuation { color: #d4d4d4 !important; }
  .msg.assistant .token.builtin    { color: #4ec9b0 !important; }
  .msg.assistant .token.boolean    { color: #569cd6 !important; }
  .msg.assistant .token.property   { color: #9cdcfe !important; }
  .msg.assistant .token.tag        { color: #569cd6 !important; }
  .msg.assistant .token.attr-name  { color: #9cdcfe !important; }
  .msg.assistant .token.attr-value { color: #ce9178 !important; }
  .msg.assistant .token.selector   { color: #d7ba7d !important; }
  .msg.assistant .token.atrule     { color: #c586c0 !important; }
  .msg.assistant .token.variable   { color: #9cdcfe !important; }
  /* Inline `code` (single-backtick, non-fenced) */
  .msg.assistant code.cv-inline {
    background: #2a2a2e; color: #ce9178;
    padding: 1px 5px; border-radius: 3px;
    font-family: 'Consolas','Fira Code',monospace; font-size: 12px; }
  /* Final-rendered assistant msg should not pre-wrap (mixed block/inline) */
  .msg.assistant.rendered { white-space: normal; }
  .msg.assistant.rendered .cv-prose { white-space: pre-wrap; }
</style>
</head>
<body>
  <main class="demo-stage" id="app">
    <div id="thread">
      <div class="msg info">Claude Codex Black — standalone. Type to send. First send will prompt for your API key.</div>
    </div>

    <section class="prompt-shell" aria-label="Prompt composer">
      <div class="prompt-input-wrap" id="input-box">
        <label class="sr-only" for="textInput">Message</label>
        <textarea id="textInput" class="prompt-input" rows="1" placeholder="Queue another message..."></textarea>
        <button id="sendBtn" class="send-button" type="button" data-tooltip="Send message" aria-label="Send message"></button>
      </div>

      <div class="prompt-toolbar">
        <div class="toolbar-group toolbar-group-left">
          <button id="addBtn" class="tool-button" type="button" data-tooltip="New conversation" aria-label="New conversation">
            <img src="{{ASSETS_BASE}}/add.svg" alt="" />
          </button>

          <button id="savedPromptsBtn" class="tool-button" type="button" data-tooltip="Stored prompts" aria-label="Stored prompts">
            <img src="{{ASSETS_BASE}}/stored_prompts.svg" alt="" />
          </button>

          <button id="label-pill" class="label-button" type="button" data-tooltip="Open settings" aria-label="Current assistant profile">
            <img src="{{ASSETS_BASE}}/label.png" alt="Claude Codex — Black Edition" />
          </button>
        </div>

        <div class="toolbar-group toolbar-group-middle">
          <button id="ttsBtn" class="tool-button" type="button" data-tooltip="Read aloud last reply (double-click = auto-read)" aria-label="Text to speech">
            <img src="{{ASSETS_BASE}}/tts.svg" alt="" />
          </button>

          <button id="sttBtn" class="tool-button" type="button" data-tooltip="Speech to text — click to start/stop" aria-label="Speech to text">
            <img src="{{ASSETS_BASE}}/stt.svg" alt="" />
          </button>

          <button id="autoReplyBtn" class="tool-button" type="button" data-tooltip="Auto reply" aria-label="Auto reply">
            <img src="{{ASSETS_BASE}}/auto_reply.svg" alt="" />
          </button>
        </div>

        <div class="toolbar-spacer" aria-hidden="true"></div>

        <button id="stopBtn" class="stop-button" type="button" data-tooltip="Stop generation" aria-label="Stop generation">
          <span class="stop-button__icon" aria-hidden="true"></span>

  <!-- Tooltip overlay used by data-tooltip elements -->

<script src="{{PRISM_JS_URI}}" data-manual></script>
<script src="{{PRISM_LANGS_URI}}"></script>
<script>
const api = (typeof acquireVsCodeApi === 'function') ? acquireVsCodeApi() : null;
const thread = document.getElementById('thread');
const ti     = document.getElementById('textInput');
const inBox  = document.getElementById('input-box');
const sendBtn= document.getElementById('sendBtn');
const addBtn = document.getElementById('addBtn');

/* ── Sound effects (SFX) — preloaded HTMLAudioElements, played on UI events ─
   16 ogg files under <extensionPath>/sounds (served via {{SOUNDS_BASE}}).
   playSfx() is fire-and-forget; failed plays are swallowed so the UI never
   throws over a sound glitch. Volume kept low (0.55) so the UI doesn't
   become a casino. */
const SFX_BASE = '{{SOUNDS_BASE}}';
const SFX = {};  // name -> HTMLAudioElement
/* User-controlled SFX gates. Hydrated from the host on `init` and updated by
   the settings modal. Defaults: enabled, 0.55 volume. */
window.SFX_ENABLED = true;
window.SFX_VOLUME  = 0.55;
function preloadSfx(name) {
  if (!SFX[name]) {
    const a = new Audio(`${SFX_BASE}/${name}.ogg`);
    a.preload = 'auto';
    a.volume = window.SFX_VOLUME;
    SFX[name] = a;
  }
  return SFX[name];
}
function playSfx(name) {
  if (!window.SFX_ENABLED) return;
  try {
    const a = preloadSfx(name);
    a.volume = window.SFX_VOLUME;
    a.currentTime = 0;
    a.play().catch((err) => console.debug('[cbe.sfx] play rejected', name, err && err.message));
  } catch (e) { console.debug('[cbe.sfx] playSfx threw', name, e && e.message); }
}
function setSfxVolume(v) {
  const n = Math.max(0, Math.min(1, Number(v)));
  if (!Number.isFinite(n)) return;
  window.SFX_VOLUME = n;
  for (const k in SFX) {
    try { SFX[k].volume = n; }
    catch (e) { console.debug('[cbe.sfx] setSfxVolume', k, e && e.message); }
  }
}
function setSfxEnabled(b) { window.SFX_ENABLED = !!b; }
['click','tick','error','popup','close_modal','open_modal','connect','claude','gtp','gemini','shell','enable','disable','open_and_close_application','maximize','minimize'].forEach(preloadSfx);

/* Active provider id, tracked so provider response start can play the right
   provider-themed cue (claude/gtp/gemini/popup-fallback). Updated on `init`
   and `info` messages where the host signals provider changes. */
let __cbeActiveProvider = null;
let __cbeOpenAppPlayed  = false;  /* play "open_and_close_application" once on first init */
let __cbeChunkStarted   = false;  /* per-turn: did we already play the provider cue? */

let busy = false;
let streamingEl = null;

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  thread.appendChild(d);
  thread.scrollTop = thread.scrollHeight;
  if (cls === 'error') playSfx('error');
  return d;
}

/* ── Markdown fence rendering ────────────────────────────────────────── */
const LANG_MAP = {
  'powershell':'powershell','posh':'powershell','ps1':'powershell','ps':'powershell','psm1':'powershell',
  'bash':'bash','sh':'bash','shell':'bash','zsh':'bash',
  'xml':'xml','html':'markup','htm':'markup','xhtml':'markup',
  'svg':'svg',
  'css':'css','scss':'css','less':'css',
  'python':'python','py':'python',
  'js':'javascript','javascript':'javascript',
  'ts':'typescript','typescript':'typescript',
  'php':'php',
  'json':'json','yaml':'yaml','yml':'yaml'
};
const LANG_LABEL = {
  'powershell':'PowerShell','bash':'Bash','markup':'HTML','xml':'XML','svg':'SVG',
  'css':'CSS','python':'Python','javascript':'JavaScript','typescript':'TypeScript',
  'php':'PHP','json':'JSON','yaml':'YAML'
};

function makeCopyBtn(rawCode) {
  const btn = document.createElement('button');
  btn.className = 'cv-copy-btn';
  btn.type = 'button';
  btn.textContent = 'Copy';
  btn.onclick = () => {
    const done = () => {
      btn.classList.add('copied');
      btn.textContent = 'Copied!';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.textContent = 'Copy';
      }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(rawCode).then(done, () => {
        /* Fallback: textarea + execCommand */
        const ta = document.createElement('textarea');
        ta.value = rawCode;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) { console.debug('[cbe.copy] execCommand fallback failed', e && e.message); }
        document.body.removeChild(ta);
        done();
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = rawCode;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) { console.debug('[cbe.copy] execCommand fallback failed', e && e.message); }
      document.body.removeChild(ta);
      done();
    }
  };
  return btn;
}

function makeCodeBlock(rawLang, rawCode) {
  /* Normalize lang. Unknown lang -> plain (no highlighting, but still wrap). */
  const key = (rawLang || '').trim().toLowerCase();
  const lang = LANG_MAP[key] || (key && /^[a-z0-9+#-]+$/i.test(key) ? key : '');
  const label = LANG_LABEL[lang] || (rawLang || 'TEXT').toUpperCase();

  const wrap = document.createElement('div');
  wrap.className = 'cv-code-wrap';

  const bar = document.createElement('div');
  bar.className = 'cv-code-bar';

  const langSpan = document.createElement('span');
  langSpan.className = 'cv-code-lang';
  langSpan.textContent = label;
  bar.appendChild(langSpan);
  bar.appendChild(makeCopyBtn(rawCode));

  const pre = document.createElement('pre');
  pre.className = 'line-numbers' + (lang ? ' language-' + lang : '');
  const codeEl = document.createElement('code');
  codeEl.className = lang ? 'language-' + lang : '';
  codeEl.textContent = rawCode;  /* textContent escapes safely */
  pre.appendChild(codeEl);

  wrap.appendChild(bar);
  wrap.appendChild(pre);

  /* Run Prism if it loaded and lang is known. */
  if (lang && window.Prism && Prism.languages && Prism.languages[lang]) {
    try { Prism.highlightElement(codeEl); }
    catch (e) { /* swallow — leave plain */ }
  }
  return wrap;
}

/* Inline `code` (single-backtick) — only on prose chunks, not inside fences. */
function renderInlineCode(textNode, container) {
  const text = textNode;
  /* Simple single-backtick pass. Skip empty matches. */
  const parts = text.split(/(`[^`\r\n]+?`)/g);
  parts.forEach(part => {
    if (!part) return;
    const m = /^`([^`\r\n]+)`$/.exec(part);
    if (m) {
      const c = document.createElement('code');
      c.className = 'cv-inline';
      c.textContent = m[1];
      container.appendChild(c);
    } else {
      const span = document.createElement('span');
      span.className = 'cv-prose';
      span.textContent = part;
      container.appendChild(span);
    }
  });
}

/* Parse the full assistant reply into a sequence of prose + fenced blocks.
   Handles unclosed trailing fences by treating remainder as a code block
   with whatever lang was specified (or plaintext). */
function renderAssistantMarkdown(el, fullText) {
  el.textContent = '';  /* clear prior plain text */
  el.classList.add('rendered');

  const fenceRe = /```([ \t]*[A-Za-z0-9+#_.\-]*)[ \t]*\r?\n([\s\S]*?)(?:```|$)/g;
  let lastIndex = 0;
  for (;;) {
    const m = fenceRe.exec(fullText);
    if (m === null) break;
    /* Prose before this fence */
    if (m.index > lastIndex) {
      renderInlineCode(fullText.slice(lastIndex, m.index), el);
    }
    const lang = m[1] || '';
    let body = m[2] || '';
    /* Strip a single trailing newline that's part of the fence sep, not the code. */
    if (body.endsWith('\n')) body = body.slice(0, -1);
    if (body.endsWith('\r')) body = body.slice(0, -1);
    el.appendChild(makeCodeBlock(lang, body));
    lastIndex = fenceRe.lastIndex;
  }
  /* Trailing prose after last fence */
  if (lastIndex < fullText.length) {
    renderInlineCode(fullText.slice(lastIndex), el);
  }
  thread.scrollTop = thread.scrollHeight;
}

function setBusy(b) {
  busy = b;
  ti.disabled = b;
  sendBtn.disabled = b;
  inBox.classList.toggle('busy', b);
}

function send() {
  if (busy) return;
  const txt = (ti.value || '').trim();
  if (!txt) return;
  addMsg(txt, 'sent');
  if (api) api.postMessage({ type: 'sendText', text: txt });
  ti.value = '';
  ti.style.height = '';
  setBusy(true);
}

/* SFX hooks: toolbar button click delegation + send-button "tick" cue.
   Both listeners are ADDITIVE — they don't replace existing per-button
   handlers, they only fire alongside them. */
document.querySelector('.prompt-toolbar').addEventListener('click', (e) => {
  const btn = e.target.closest && e.target.closest('.tool-button, .label-button, .stop-button');
  if (btn) playSfx('click');
});
sendBtn.addEventListener('click', () => { if (!busy) playSfx('tick'); });

sendBtn.onclick = send;
addBtn.onclick = () => {
  if (api) api.postMessage({ type: 'reset' });
  thread.innerHTML = '';
  addMsg('Conversation reset.', 'info');
  try { tts.stop(); } catch (e) { console.debug('[cbe.tts] addBtn reset stop', e && e.message); }
};
document.getElementById('monitorBtn').onclick = () => { if (api) api.postMessage({ type: 'showTrace' }); };
document.getElementById('label-pill').onclick = () => { if (api) api.postMessage({ type: 'labelClick' }); };
document.getElementById('settingsBtn').onclick = () => { if (api) api.postMessage({ type: 'openSettings' }); };

/* ── Read aloud (TTS 🔊) — click=read last reply, double-click=auto-read ─ */
const tts = (function() {
  const btn = document.getElementById('ttsBtn');
  const synth = window.speechSynthesis;
  let lastReply = '';
  let autoRead = false;

  function isSpeaking() { return synth && synth.speaking; }

  function setIdle() {
    btn.classList.remove('speaking');
    if (!autoRead) btn.textContent = '🔊';
  }

  function speak(txt) {
    if (!synth) { addMsg('Speech synthesis not available in this webview.', 'error'); return; }
    if (!txt) return;
    synth.cancel();
    const utt = new SpeechSynthesisUtterance(txt);
    utt.lang = navigator.language || 'en-US';
    utt.onend = utt.onerror = setIdle;
    btn.classList.add('speaking');
    btn.textContent = '⏹';
    synth.speak(utt);
  }

  function stopAll() {
    if (synth) synth.cancel();
    setIdle();
  }

  btn.addEventListener('click', (e) => {
    /* dblclick fires before second click; let dblclick handle that case */
    if (e.detail >= 2) return;
    if (isSpeaking()) { stopAll(); return; }
    if (lastReply) speak(lastReply);
  });

  btn.addEventListener('dblclick', () => {
    autoRead = !autoRead;
    btn.classList.toggle('autoread', autoRead);
    btn.title = autoRead
      ? 'Auto-read ON — double-click to disable'
      : 'Read aloud last reply — double-click for auto-read';
    if (!autoRead) stopAll();
  });

  return {
    setLastReply(t) { lastReply = (t || '').trim(); },
    onAssistantDone(t) {
      lastReply = (t || '').trim();
      if (autoRead && lastReply) speak(lastReply);
    },
    stop: stopAll,
  };
})();

/* ── Web Speech dictation (STT button, .speaking class toggles a red tint) ─ */
(function() {
  const sttBtn = document.getElementById('sttBtn');
  let recog = null;
  let listening = false;

  function stopMic() {
    const wasListening = listening || !!recog;
    if (recog) {
      try { recog.stop(); }
      catch (e) { console.debug('[cbe.stt] recog.stop', e && e.message); }
      recog = null;
    }
    listening = false;
    sttBtn.classList.remove('speaking');
    sttBtn.title = 'Speech to Text — click to start/stop';
    if (wasListening) playSfx('disable');
  }

  function appendToInput(t) {
    const cur = (ti.value || '').replace(/\s+$/, '');
    ti.value = cur ? (cur + ' ' + t) : t;
    ti.dispatchEvent(new Event('input', { bubbles: true }));
    ti.focus();
  }

  sttBtn.onclick = () => {
    if (listening) { stopMic(); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      addMsg('Web Speech API not available in this webview.', 'error');
      return;
    }
    try {
      recog = new SR();
      recog.continuous   = false;
      recog.interimResults = false;
      recog.lang = (navigator.language || 'en-US');
      recog.onresult = (e) => {
        const r = e.results && e.results[0] && e.results[0][0];
        if (r && r.transcript) appendToInput(r.transcript.trim());
      };
      recog.onerror = (e) => {
        addMsg('Voice: ' + (e.error || 'error'), 'error');
        stopMic();
      };
      recog.onend = () => stopMic();
      recog.start();
      listening = true;
      sttBtn.classList.add('speaking');
      sttBtn.title = 'Listening… click to stop';
      playSfx('connect');
    } catch (e) {
      addMsg('Voice start failed: ' + (e.message || e), 'error');
      stopMic();
    }
  };
})();


/* ── New toolbar button click handlers ───────────────────────────────────
   Each post-able to the extension host where appropriate; the rest log
   placeholders so the buttons are clickable before their handlers land. */
(function() {
  function bind(id, type, payload) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', () => {
      if (api && type) api.postMessage({ type, ...(payload || {}) });
      else addMsg(`(stub) ${id} clicked`, 'info');
    });
  }
  bind('stopBtn',           'cancelInFlight');
  bind('savedPromptsBtn',   'openSavedPrompts');
  bind('storedPromptsBtn',  'openStoredPrompts');
  bind('chatHistoryBtn',    'openChatHistory');
  bind('attachFileBtn',     'attachFile');
  bind('autoReplyBtn',      'toggleAutoReply');
  bind('wakeUpBtn',         'toggleWakeUp');
  bind('showCommandsBtn',   'showCommandMenu');
  bind('compactBtn',        'compactConversation');
  bind('handbookBtn',       'openHandbook');
  bind('helpBtn',           'openHelp');
  bind('extensionsBtn',     'openExtensions');
  bind('projectFolderBtn',  'openProjectFolder');
  bind('gitBtn',            'openGit');
  bind('githubBtn',         'openGitHub');
})();

/* Font Size toggle — adds/removes .cb-big on <body>, which flips
   --cb-font-scale from 1 to 1.8 (80% bigger) via the rules at the top of
   <style>. Persists via the host's workspaceState as `cbe.bigFont`. */
(function() {
  const btn = document.getElementById('fontSizeBtn');
  if (!btn) return;
  function applyBig(b) {
    document.body.classList.toggle('cb-big', !!b);
    btn.classList.toggle('autoread', !!b);   /* reuse the existing "active" affordance */
  }
  btn.addEventListener('click', () => {
    const next = !document.body.classList.contains('cb-big');
    applyBig(next);
    if (api) api.postMessage({ type: 'setBigFont', value: next });
  });
  window.__cbApplyBig = applyBig;            /* called from init hydration */
})();

/* ── Settings modal ──────────────────────────────────────────────────── */
let __cbeProviders = [];   /* {id,label,models[],current,haveKey} */
let __cbeActive = null;

function openSettings(payload) {
  __cbeProviders = payload.providers || [];
  __cbeActive    = payload.active || (__cbeProviders[0] && __cbeProviders[0].id);
  playSfx('open_modal');
  closeSettings(true);
  const overlay = document.createElement('div');
  overlay.id = 'cbe-settings';
  overlay.innerHTML = ''
    + '<div class="cbe-box">'
    +   '<div class="cbe-hdr"><span>Settings — Provider &amp; Model</span><button type="button" class="cbe-btn cbe-cancel" data-act="cancel" style="padding:2px 8px">✕</button></div>'
    +   '<div class="cbe-body">'
    +     '<div><label>Provider</label><select id="cbe-set-provider"></select></div>'
    +     '<div><label>Model</label><select id="cbe-set-model"></select></div>'
    +     '<div class="cbe-warn" id="cbe-set-warn">No API key configured for this provider in config.ini.</div>'
    +     '<div style="display:flex;align-items:center;gap:10px;margin-top:4px;">'
    +       '<label for="cbe-set-sfx-enabled" style="margin:0;flex:1;">Sound Effects</label>'
    +       '<input type="checkbox" id="cbe-set-sfx-enabled" style="width:auto;accent-color:#e8621a;cursor:pointer;">'
    +     '</div>'
    +     '<div>'
    +       '<label for="cbe-set-sfx-volume">Volume <span id="cbe-set-sfx-volume-pct" style="opacity:.65;font-weight:400;">55%</span></label>'
    +       '<input type="range" id="cbe-set-sfx-volume" min="0" max="100" step="1" value="55" style="width:100%;accent-color:#e8621a;cursor:pointer;">'
    +     '</div>'
    +   '</div>'
    +   '<div class="cbe-foot">'
    +     '<button type="button" class="cbe-btn cbe-save"   id="cbe-set-login" data-act="login" style="display:none;background:#2a5d8f">Open login</button>'
    +     '<button type="button" class="cbe-btn cbe-cancel" data-act="cancel">Cancel</button>'
    +     '<button type="button" class="cbe-btn cbe-save"   data-act="save">Save</button>'
    +   '</div>'
    + '</div>';
  document.body.appendChild(overlay);

  const sel = overlay.querySelector('#cbe-set-provider');
  __cbeProviders.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id;
    let suffix = '';
    if (p.superGrok) suffix = '  (SuperGrok)';
    else if (p.webBridge) suffix = '  (web)';
    else if (!p.haveKey) suffix = '  (no key)';
    o.textContent = p.label + suffix;
    sel.appendChild(o);
  });
  sel.value = __cbeActive;

  const renderModels = () => {
    const cur = sel.value;
    const prov = __cbeProviders.find(p => p.id === cur);
    const ms = overlay.querySelector('#cbe-set-model');
    ms.innerHTML = '';
    (prov.models || []).forEach(m => {
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      ms.appendChild(o);
    });
    if (prov.current && !Array.from(ms.options).some(o => o.value === prov.current)) {
      const o = document.createElement('option');
      o.value = prov.current; o.textContent = prov.current;
      ms.insertBefore(o, ms.firstChild);
    }
    ms.value = prov.current || (prov.models && prov.models[0]) || '';
    /* For web-bridge / SuperGrok providers, the model is fixed and the
       missing-key warn shouldn't fire — instead show a hint and a Login
       button. The button label is provider-specific. */
    const warn = overlay.querySelector('#cbe-set-warn');
    const loginBtn = overlay.querySelector('#cbe-set-login');
    if (prov.webBridge || prov.superGrok) {
      warn.classList.remove('show');
      ms.disabled = true;
      loginBtn.style.display = 'inline-block';
      const niceName =
        prov.id === 'chatgptWeb'   ? 'ChatGPT'  :
        prov.id === 'grokWeb'      ? 'Grok'     :
        prov.id === 'geminiBridge' ? 'Gemini'   :
        prov.id === 'claudeBridge' ? 'Claude'   :
        prov.label;
      loginBtn.textContent = 'Open ' + niceName + ' login';
    } else {
      ms.disabled = false;
      loginBtn.style.display = 'none';
      warn.classList.toggle('show', !prov.haveKey);
    }
  };
  sel.addEventListener('change', renderModels);
  renderModels();

  /* SFX controls. Hydrate from current window state, wire live preview so
     user hears the volume change while dragging the slider; persistence
     fires on Save. */
  const sfxEnabled = overlay.querySelector('#cbe-set-sfx-enabled');
  const sfxVolume  = overlay.querySelector('#cbe-set-sfx-volume');
  const sfxVolPct  = overlay.querySelector('#cbe-set-sfx-volume-pct');
  sfxEnabled.checked = !!window.SFX_ENABLED;
  sfxVolume.value    = String(Math.round((window.SFX_VOLUME || 0.55) * 100));
  sfxVolPct.textContent = `${sfxVolume.value}%`;
  sfxEnabled.addEventListener('change', () => setSfxEnabled(sfxEnabled.checked));
  sfxVolume.addEventListener('input', () => {
    const n = Number(sfxVolume.value);
    sfxVolPct.textContent = `${n}%`;
    setSfxVolume(n / 100);
  });
  sfxVolume.addEventListener('change', () => playSfx('click'));

  overlay.addEventListener('click', (e) => {
    const act = e.target.getAttribute && e.target.getAttribute('data-act');
    if (act === 'cancel' || e.target === overlay) {
      /* Revert live-previewed SFX changes if the user cancels. */
      setSfxEnabled(__cbeSavedSfxEnabled);
      setSfxVolume(__cbeSavedSfxVolume);
      closeSettings();
      return;
    }
    if (act === 'save') {
      const provider = overlay.querySelector('#cbe-set-provider').value;
      const model    = overlay.querySelector('#cbe-set-model').value;
      __cbeActiveProvider = provider;
      const sfxEnabledVal = !!sfxEnabled.checked;
      const sfxVolumeVal  = Number(sfxVolume.value) / 100;
      setSfxEnabled(sfxEnabledVal);
      setSfxVolume(sfxVolumeVal);
      __cbeSavedSfxEnabled = sfxEnabledVal;
      __cbeSavedSfxVolume  = sfxVolumeVal;
      if (api) api.postMessage({
        type: 'setProvider', provider, model,
        sfxEnabled: sfxEnabledVal, sfxVolume: sfxVolumeVal,
      });
      closeSettings();
    }
    if (act === 'login') {
      const provider = overlay.querySelector('#cbe-set-provider').value;
      if (api) api.postMessage({ type: 'openWebLogin', provider });
    }
  });
  document.addEventListener('keydown', escClose, true);
}
/* Saved SFX state baseline so Cancel can revert live previews. Hydrated
   on `init` from the host's persisted workspaceState. */
let __cbeSavedSfxEnabled = true;
let __cbeSavedSfxVolume  = 0.55;
function escClose(e) { if (e.key === 'Escape') closeSettings(); }
function closeSettings(suppressSfx) {
  const old = document.getElementById('cbe-settings');
  if (old) {
    old.remove();
    if (!suppressSfx) playSfx('close_modal');
  }
  document.removeEventListener('keydown', escClose, true);
}

/* Tell host we're ready to receive init payload. */
if (api) api.postMessage({ type: 'ready' });

ti.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
ti.addEventListener('input', function() {
  this.style.height = '';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});

/* Map provider id → SFX cue. anthropic→claude, openai→gtp, google/gemini→gemini,
   anything else → 'popup' fallback so the user still gets an audible "the
   model is replying" signal. */
function providerSfxName(id) {
  if (!id) return 'popup';
  if (id === 'anthropic' || id === 'claudeBridge') return 'claude';
  if (id === 'openai'    || id === 'chatgptWeb')   return 'gtp';
  if (id === 'gemini'    || id === 'geminiBridge' || id === 'google') return 'gemini';
  return 'popup';
}

window.addEventListener('message', e => {
  const m = e.data || {};
  if (m.type === 'assistantStart') {
    streamingEl = addMsg('', 'assistant streaming');
    __cbeChunkStarted = false;
  } else if (m.type === 'chunk') {
    if (!streamingEl) streamingEl = addMsg('', 'assistant streaming');
    if (!__cbeChunkStarted) {
      __cbeChunkStarted = true;
      playSfx(providerSfxName(__cbeActiveProvider));
    }
    streamingEl.textContent += (m.text || '');
    thread.scrollTop = thread.scrollHeight;
  } else if (m.type === 'assistantDone') {
    if (streamingEl) {
      streamingEl.classList.remove('streaming');
      const fullText = (typeof m.text === 'string' && m.text)
        ? m.text
        : (streamingEl.textContent || '');
      try {
        renderAssistantMarkdown(streamingEl, fullText);
      } catch (e) {
        /* Rendering failed — fall back to plain text so the user still sees the reply. */
        streamingEl.textContent = fullText;
      }
      streamingEl = null;
      try { tts.onAssistantDone(fullText); } catch (e) { console.debug('[cbe.tts] onAssistantDone', e && e.message); }
    }
    setBusy(false);
    ti.focus();
  } else if (m.type === 'error') {
    if (streamingEl) { streamingEl.classList.remove('streaming'); streamingEl = null; }
    addMsg('⚠ ' + (m.message || 'error'), 'error');
    setBusy(false);
  } else if (m.type === 'info') {
    addMsg(m.text || '', 'info');
  } else if (m.type === 'init') {
    /* Cache provider state for later; don't open modal yet. */
    __cbeProviders = m.providers || [];
    __cbeActive    = m.active;
    __cbeActiveProvider = m.active;
    /* Hydrate persisted SFX settings; window defaults apply if absent. */
    if (typeof m.sfxEnabled === 'boolean') { setSfxEnabled(m.sfxEnabled); __cbeSavedSfxEnabled = m.sfxEnabled; }
    if (typeof m.sfxVolume  === 'number')  { setSfxVolume(m.sfxVolume);   __cbeSavedSfxVolume  = m.sfxVolume; }
    if (typeof m.bigFont    === 'boolean' && window.__cbApplyBig) { window.__cbApplyBig(m.bigFont); }
    if (!__cbeOpenAppPlayed) {
      __cbeOpenAppPlayed = true;
      playSfx('open_and_close_application');
    }
  } else if (m.type === 'openSettings') {
    __cbeActiveProvider = m.active || __cbeActiveProvider;
    openSettings(m);
  }
});

/* ────────────────────────────────────────────────────────────────────────
   Data-tooltip overlay (GPT's prompt-bar design uses #tooltip + data-tooltip
   attrs instead of native title=). One delegated mouseover handler positions
   the floating tooltip near the cursor; mouseleave hides it. */
(function(){
  const tip = document.getElementById('tooltip');
  if (!tip) return;
  function show(text, x, y) {
    if (!text) return hide();
    tip.textContent = text;
    tip.classList.add('is-visible');
    tip.setAttribute('aria-hidden', 'false');
    place(x, y);
  }
  function place(x, y) {
    const w = tip.offsetWidth, h = tip.offsetHeight;
    const left = Math.min(window.innerWidth - w - 10, x + 14);
    const top  = Math.max(10, y - h - 18);
    tip.style.transform = `translate(${left}px, ${top}px)`;
  }
  function hide() {
    tip.classList.remove('is-visible');
    tip.setAttribute('aria-hidden', 'true');
    tip.style.transform = 'translate(-9999px,-9999px)';
  }
  document.body.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-tooltip]');
    if (t) show(t.getAttribute('data-tooltip'), e.clientX, e.clientY);
  });
  document.body.addEventListener('mousemove', e => {
    if (tip.classList.contains('is-visible')) place(e.clientX, e.clientY);
  });
  document.body.addEventListener('mouseout', e => {
    if (e.target.closest('[data-tooltip]')) hide();
  });
})();

/* ────────────────────────────────────────────────────────────────────────
   Right-click context menu + View Source modal
   Menu shows for ALL right-clicks; "View Source" is enabled only when the
   click target is inside `pre code`. Another agent owns DevTools, so we
   build a clean single-item menu here; merges can append items later.
   ──────────────────────────────────────────────────────────────────────── */
(function(){
  var CMENU_ID = 'cbe-ctx-menu';
  var MODAL_ID = 'cbe-source-modal';

  /* Supported Prism languages (per task spec) and common aliases. */
  var LANG_ALIAS = {
    'sh': 'bash', 'shell': 'bash', 'zsh': 'bash',
    'ps': 'powershell', 'ps1': 'powershell', 'pwsh': 'powershell',
    'py': 'python',
    'ts': 'typescript', 'tsx': 'typescript',
    'js': 'javascript', 'jsx': 'javascript',
    'html': 'markup', 'xml': 'markup', 'svg': 'markup',
  };
  var SUPPORTED = {
    powershell: 1, bash: 1, xml: 1, markup: 1, css: 1, python: 1,
    svg: 1, javascript: 1, js: 1, typescript: 1, ts: 1, php: 1,
  };

  function normalizeLang(raw) {
    if (!raw) return 'markup';
    raw = String(raw).toLowerCase().trim();
    if (LANG_ALIAS[raw]) raw = LANG_ALIAS[raw];
    return SUPPORTED[raw] ? raw : 'markup';
  }

  function removeMenu() {
    var old = document.getElementById(CMENU_ID);
    if (old) old.remove();
  }

  function removeModal() {
    var old = document.getElementById(MODAL_ID);
    if (old) old.remove();
  }

  function findCodeEl(target) {
    if (!target || !target.closest) return null;
    return target.closest('pre code');
  }

  function showCtxMenu(x, y, codeEl) {
    removeMenu();
    var menu = document.createElement('div');
    menu.id = CMENU_ID;

    /* View Source — enabled only when right-clicked on a <pre><code>. */
    var item = document.createElement('div');
    item.className = 'cbe-item' + (codeEl ? '' : ' disabled');
    var lang = '';
    if (codeEl) {
      lang = (codeEl.className.match(/language-(\S+)/) || [])[1] || '';
    }
    item.textContent = '📄 View Source' + (lang ? ' (' + lang + ')' : '');
    if (codeEl) {
      item.addEventListener('mousedown', function(e) {
        e.preventDefault(); e.stopPropagation();
        removeMenu();
        showSourceModal(codeEl.textContent, lang);
      });
    }
    menu.appendChild(item);

    /* Open DevTools — always enabled. Asks host to fire the VS Code command. */
    var dev = document.createElement('div');
    dev.className = 'cbe-item';
    dev.textContent = '🔧 Open DevTools';
    dev.addEventListener('mousedown', function(e) {
      e.preventDefault(); e.stopPropagation();
      removeMenu();
      if (api) api.postMessage({ type: 'openDevTools' });
    });
    menu.appendChild(dev);

    menu.style.left = x + 'px';
    menu.style.top  = y + 'px';
    document.body.appendChild(menu);

    /* Reposition if off-screen */
    var r = menu.getBoundingClientRect();
    if (r.right  > window.innerWidth)  menu.style.left = Math.max(0, x - r.width)  + 'px';
    if (r.bottom > window.innerHeight) menu.style.top  = Math.max(0, y - r.height) + 'px';

    /* Dismiss on outside click */
    setTimeout(function() {
      function dismiss(e) {
        if (!menu.contains(e.target)) {
          removeMenu();
          document.removeEventListener('mousedown', dismiss, true);
        }
      }
      document.addEventListener('mousedown', dismiss, true);
    }, 0);
  }

  function showSourceModal(code, rawLang) {
    removeModal();
    var lang = normalizeLang(rawLang);

    var overlay = document.createElement('div');
    overlay.id = MODAL_ID;

    var box = document.createElement('div');
    box.className = 'cbe-box';

    var hdr = document.createElement('div');
    hdr.className = 'cbe-hdr';

    var title = document.createElement('span');
    title.className = 'cbe-title';
    title.textContent = 'View Source' + (rawLang ? ' — ' + rawLang : '');

    var actions = document.createElement('div');
    actions.className = 'cbe-actions';

    var copyBtn = document.createElement('button');
    copyBtn.className = 'cbe-copy';
    copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', function() {
      try {
        navigator.clipboard.writeText(code).then(function() {
          copyBtn.textContent = 'Copied!';
          setTimeout(function() { copyBtn.textContent = 'Copy'; }, 1500);
        });
      } catch (e) {
        copyBtn.textContent = 'Failed';
      }
    });

    var closeBtn = document.createElement('button');
    closeBtn.className = 'cbe-close';
    closeBtn.textContent = '✕';
    closeBtn.addEventListener('click', removeModal);

    hdr.appendChild(title);
    actions.appendChild(copyBtn);
    actions.appendChild(closeBtn);
    hdr.appendChild(actions);

    var scroller = document.createElement('div');
    scroller.className = 'cbe-scroller';

    /* Build a row-per-line table so line numbers stay aligned even when
       Prism's wrapping spans cross newlines. */
    var pre = document.createElement('pre');
    pre.className = 'language-' + lang;

    /* Highlight first (Prism returns string), then split by lines. */
    var html;
    try {
      if (window.Prism && Prism.languages[lang]) {
        html = Prism.highlight(code, Prism.languages[lang], lang);
      } else {
        html = escapeHtml(code);
      }
    } catch (e) {
      html = escapeHtml(code);
    }

    var lines = html.split('\n');
    var table = document.createElement('div');
    table.className = 'cbe-numbered';
    /* Strip a trailing empty line (most files end in \n). */
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    lines.forEach(function(line, i) {
      var row = document.createElement('div');
      row.className = 'cbe-row';
      var ln = document.createElement('span');
      ln.className = 'cbe-ln';
      ln.textContent = String(i + 1);
      var codeCell = document.createElement('span');
      codeCell.className = 'cbe-code language-' + lang;
      codeCell.innerHTML = line || ' ';
      row.appendChild(ln);
      row.appendChild(codeCell);
      table.appendChild(row);
    });
    pre.appendChild(table);
    scroller.appendChild(pre);

    box.appendChild(hdr);
    box.appendChild(scroller);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    overlay.addEventListener('mousedown', function(e) {
      if (e.target === overlay) removeModal();
    });
    document.addEventListener('keydown', function escClose(e) {
      if (e.key === 'Escape') {
        removeModal();
        document.removeEventListener('keydown', escClose);
      }
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* Single global contextmenu listener — capture phase so we override
     VS Code's default webview menu. */
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    var codeEl = findCodeEl(e.target);
    showCtxMenu(e.clientX, e.clientY, codeEl);
  });

  /* Expose for future agents (e.g. DevTools merge). */
  window.__cbeShowSource = showSourceModal;
  window.__cbeShowCtxMenu = showCtxMenu;
})();
</script>
</body>
</html>
