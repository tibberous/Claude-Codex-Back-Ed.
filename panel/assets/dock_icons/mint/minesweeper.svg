<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dy="1.5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="22" ry="22" fill="url(#base)" filter="url(#dropShadow)"/>
  <rect x="6.5" y="6.5" width="87" height="87" rx="21.5" ry="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="1"/>
  <rect x="8" y="8" width="84" height="46" rx="20" ry="20" fill="url(#shine)"/>
  <rect x="8" y="54" width="84" height="38" rx="18" ry="18" fill="url(#bottomGlow)"/>
  <g>
    <!-- bomb -->
    <circle cx="48" cy="58" r="22" fill="#1a1a1a"/>
    <!-- bomb shine -->
    <ellipse cx="40" cy="50" rx="6" ry="3" fill="#ffffff" opacity="0.55"/>
    <!-- spikes -->
    <g stroke="#1a1a1a" stroke-width="6" stroke-linecap="round">
      <line x1="48" y1="28" x2="48" y2="22"/>
      <line x1="18" y1="58" x2="24" y2="58"/>
      <line x1="72" y1="58" x2="78" y2="58"/>
      <line x1="48" y1="88" x2="48" y2="94"/>
      <line x1="27" y1="37" x2="32" y2="42"/>
      <line x1="69" y1="37" x2="64" y2="42"/>
      <line x1="27" y1="79" x2="32" y2="74"/>
      <line x1="69" y1="79" x2="64" y2="74"/>
    </g>
    <!-- fuse + spark -->
    <path d="M58 38 q 8 -8 14 -2" stroke="#a87a3c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="74" cy="34" r="4" fill="#FF6B00"/>
    <circle cx="74" cy="34" r="2" fill="#FFE066"/>
  </g>
</svg>
