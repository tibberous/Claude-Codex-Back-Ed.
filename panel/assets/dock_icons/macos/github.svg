<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dy="1.5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- base rounded square -->
  <rect x="6" y="6" width="88" height="88" rx="22" ry="22" fill="url(#base)" filter="url(#dropShadow)"/>
  <!-- inner highlight ring -->
  <rect x="6.5" y="6.5" width="87" height="87" rx="21.5" ry="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="1"/>
  <!-- top shine -->
  <rect x="8" y="8" width="84" height="46" rx="20" ry="20" fill="url(#shine)"/>
  <!-- bottom inner glow -->
  <rect x="8" y="54" width="84" height="38" rx="18" ry="18" fill="url(#bottomGlow)"/>
  <!-- glyph -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 26 C35 26 26 36 26 50 C26 60 32 68 42 71 V63 C36 64 34 60 34 60 C33 58 31 57 31 57 C28 55 31 55 31 55 C34 55 35 58 35 58 C37 62 41 61 42 60 C42 58 43 56 45 55 C38 54 32 51 32 42 C32 39 33 37 35 35 C35 34 33 31 35 27 C35 27 38 27 42 30 C44 29 47 29 50 29 C53 29 56 29 58 30 C62 27 65 27 65 27 C67 31 65 34 65 35 C67 37 68 39 68 42 C68 51 62 54 55 55 C57 56 58 58 58 61 V71 C68 68 74 60 74 50 C74 36 65 26 50 26 Z"/>
  </g>
</svg>
